function alvValidar(){
  var erros = [];
  function req(id, label){
    var el = document.getElementById(id);
    if(!el || !el.value || !el.value.trim()) erros.push(label);
  }
  function reqFile(id, label){
    var el = document.getElementById(id);
    if(!el || !el.files || !el.files[0]) erros.push(label);
  }

  var alvaraNA = document.getElementById('alv-alvara-atual-na');
  if(!(alvaraNA && alvaraNA.checked)) reqFile('alv-alvara-atual', 'Alvará de funcionamento atual (pergunta 1)');

  var localRadio = document.querySelector('input[name="alv-local"]:checked');
  if(!localRadio) erros.push('Se a atividade será presencial ou apenas fiscal (pergunta 2)');
  else if(localRadio.value==='presencial') req('alv-local-atividade', 'Especificação da(s) atividade(s) presencial(is) (pergunta 2)');

  reqFile('alv-iptu', 'Guia de IPTU do imóvel (pergunta 3)');

  var sanitarioNA = document.getElementById('alv-sanitario-na');
  if(!(sanitarioNA && sanitarioNA.checked)) reqFile('alv-sanitario', 'Alvará sanitário (pergunta 4)');

  var finalCiente = document.getElementById('alv-final-ciente');
  if(!finalCiente || !finalCiente.checked) erros.push('Confirmação "Estou ciente!" das informações finais');

  return erros;
}

async function enviarSolicitacaoAlvara(){
  var erros = alvValidar();
  var errBox = document.getElementById('alv-errors');
  if(erros.length){
    if(errBox){
      errBox.style.display = 'block';
      errBox.innerHTML = '<strong>Antes de enviar, complete os campos obrigatórios abaixo:</strong><ul style="margin:.5rem 0 0 1.1rem; padding:0;">'+erros.map(function(e){return '<li>'+esc(e)+'</li>';}).join('')+'</ul>';
      errBox.scrollIntoView({behavior:'smooth', block:'start'});
    }
    toast('Existem campos obrigatórios pendentes.');
    return;
  }

  var submitBtn = document.getElementById('alv-submit-btn');
  if(submitBtn) submitBtn.disabled = true;
  toast('Enviando arquivos...');

  var u = currentUser();
  var s = SERVICE_MAP['alvara-funcionamento'];
  var alvaraNA = document.getElementById('alv-alvara-atual-na');
  var sanitarioNA = document.getElementById('alv-sanitario-na');
  var localRadio = document.querySelector('input[name="alv-local"]:checked');
  var id = 'p'+Date.now();

  var dados;
  try{
    dados = {
      alvaraAtualNaoPossui: !!(alvaraNA && alvaraNA.checked),
      alvaraAtualArquivo: !(alvaraNA && alvaraNA.checked) ? await fabArquivoReal('alv-alvara-atual', id, 'alvara-atual') : null,
      localOpcao: localRadio ? localRadio.value : '',
      localAtividade: (localRadio && localRadio.value==='presencial') ? document.getElementById('alv-local-atividade').value.trim() : '',
      iptuArquivo: await fabArquivoReal('alv-iptu', id, 'iptu'),
      sanitarioNaoAplica: !!(sanitarioNA && sanitarioNA.checked),
      sanitarioArquivo: !(sanitarioNA && sanitarioNA.checked) ? await fabArquivoReal('alv-sanitario', id, 'sanitario') : null,
      cienteServico: true
    };
  }catch(e){
    console.error(e);
    if(submitBtn) submitBtn.disabled = false;
    toast('Não foi possível enviar um ou mais arquivos. Tente novamente.');
    return;
  }

  var ok = await finalizarNovoProcesso({
    id:id, servicoId:'alvara-funcionamento', status:'aguardando_pagamento', etapaAtual:-1,
    criadoEm: todayISO(), protocolo:'',
    historico:[{data:todayISO(), hora:nowHM(), texto:'Formulário de '+s.nome+' preenchido e enviado pelo cliente. Aguardando envio do boleto.', autor:'cliente'}],
    documentosAndamento:[], documentosFinais:[],
    formularioAlvara: dados
  });
  if(!ok && submitBtn) submitBtn.disabled = false;
}

function renderFormularioAlvaraResumo(p){
  var d = p.formularioAlvara;
  if(!d) return '';

  function docRow(label, doc){
    if(!doc) return '';
    var nomeArquivo = typeof doc === 'string' ? doc : doc.nome;
    var path = doc && typeof doc === 'object' ? doc.path : null;
    var btn = path
      ? '<button class="btn btn-subtle btn-sm" style="flex:none;" onclick="PS.baixarArquivoReal(\''+esc(path)+'\')">Baixar</button>'
      : '<button class="btn btn-subtle btn-sm" style="flex:none;" disabled title="Arquivo original não disponível para download">Baixar</button>';
    return '<div class="file-row" style="align-items:flex-start;">'+
        '<span class="ic" style="margin-top:.1rem;">📄</span>'+
        '<span class="name" style="white-space:normal; overflow:visible; text-overflow:clip; line-height:1.35;">'+esc(label)+'<span style="display:block; font-size:.74rem; font-weight:500; color:var(--ink-faint); margin-top:.15rem;">'+esc(nomeArquivo)+'</span></span>'+
        btn+
      '</div>';
  }

  var docItems = [];
  if(d.alvaraAtualArquivo) docItems.push(docRow('Alvará de funcionamento atual', d.alvaraAtualArquivo));
  if(d.iptuArquivo) docItems.push(docRow('Guia de IPTU do imóvel', d.iptuArquivo));
  if(d.sanitarioArquivo) docItems.push(docRow('Alvará sanitário', d.sanitarioArquivo));
  var docsHtml = docItems.length ? docItems.join('') : '<p style="font-size:.84rem; color:var(--ink-faint);">Nenhum documento anexado pelo cliente neste formulário.</p>';

  return '<div class="card" style="padding:1.2rem 1.3rem; display:flex; flex-direction:column; gap:1.3rem;">'+
    '<div style="display:flex; align-items:center; justify-content:space-between; gap:.8rem; flex-wrap:wrap;">'+
      '<span class="eyebrow">Formulário de Alvará de Funcionamento enviado pelo cliente</span>'+
      '<span class="pill tag-confirmado"><span class="pill-dot"></span>Respostas e documentos do cliente</span>'+
    '</div>'+
    '<div>'+
      '<div class="eyebrow" style="margin-bottom:.7rem;">Dados gerais</div>'+
      '<div class="info-grid">'+
        '<div class="info-block"><span class="lbl">Alvará atual</span><span class="val">'+(d.alvaraAtualNaoPossui?'Não possui':'Anexado')+'</span></div>'+
        '<div class="info-block"><span class="lbl">Atividade presencial ou fiscal</span><span class="val">'+(d.localOpcao==='presencial'?'Haverá atividade presencial':'Apenas fins fiscais')+'</span></div>'+
        (d.localAtividade ? '<div class="info-block full" style="grid-column:1/-1;"><span class="lbl">Atividade(s) exercida(s) presencialmente</span><span class="val">'+esc(d.localAtividade)+'</span></div>' : '')+

      '</div>'+
    '</div>'+
    '<div>'+
      '<div class="eyebrow" style="margin-bottom:.7rem;">Documentos anexados pelo cliente</div>'+
      '<div class="upload-list">'+docsHtml+'</div>'+
    '</div>'+
  '</div>';
}

function renderSolicitacaoBlock(p, clientMode){
  if(p.solicitacaoDocs===undefined && !p.solicitacaoInfo) return '';
  var docs = p.solicitacaoDocs || [];
  var rows = docs.map(function(d,i){
    var attached = !!d.arquivo;
    var rightSide;
    if(attached){
      rightSide = '<span style="font-size:.78rem; font-weight:600; color:var(--success); white-space:nowrap;">✓ '+esc(d.arquivo)+'</span>'+
        (d.path ? ' <button class="btn btn-subtle btn-sm" onclick="PS.baixarArquivoReal(\''+esc(d.path)+'\')">Baixar</button>' : '');
    } else if(clientMode && p.status!=='concluido'){
      rightSide = '<label class="file-picker" for="pend-'+p.id+'-'+i+'">Anexar agora</label>'+
        '<input type="file" id="pend-'+p.id+'-'+i+'" style="display:none;" onchange="PS.anexarDocPendente(\''+p.id+'\','+i+')">';
    } else {
      rightSide = '<span class="pill tag-estimado">pendente</span>';
    }
    return '<div class="upload-row'+(attached?' attached':'')+'">'+
      '<div class="upload-row-label"><span class="req-dot"></span>'+esc(d.nome)+'</div>'+rightSide+
    '</div>';
  }).join('');
  var infoHtml = p.solicitacaoInfo ? '<div style="margin-top:1rem; padding-top:.9rem; border-top:1px dashed var(--border);"><span class="eyebrow">Informações enviadas pelo cliente</span><p style="font-size:.85rem; margin-top:.5rem; white-space:pre-wrap; line-height:1.5;">'+esc(p.solicitacaoInfo)+'</p></div>' : '';
  return '<div class="card" style="padding:1.2rem 1.3rem;"><span class="eyebrow">Documentos e informações da solicitação</span>'+
    '<div class="upload-list" style="margin-top:.9rem;">'+(rows || '<p style="font-size:.83rem; color:var(--ink-faint);">Nenhum documento cadastrado nesta solicitação.</p>')+'</div>'+
    infoHtml+
  '</div>';
}
async function anexarDocPendente(processId, idx){
  var p = state.processes.filter(function(x){return x.id===processId;})[0];
  var input = document.getElementById('pend-'+processId+'-'+idx);
  if(!p || !input || !input.files || !input.files[0]) return;
  var file = input.files[0];
  toast('Enviando arquivo...');
  try{
    var doc = await uploadArquivoReal(file, processId, 'pendentes');
    var snapshot = JSON.parse(JSON.stringify(p));
    p.solicitacaoDocs[idx].arquivo = file.name;
    p.solicitacaoDocs[idx].path = doc.path;
    p.historico.push({data:todayISO(), hora:nowHM(), texto:'Documento "'+p.solicitacaoDocs[idx].nome+'" anexado pelo cliente: '+file.name+'.', autor:'cliente'});
    saveState();
    render();
    var ok = await salvarProcessoNoServidor(p);
    if(ok){
      toast('Documento anexado!');
    } else {
      Object.assign(p, snapshot);
      saveState();
      render();
      toast('O arquivo foi enviado, mas não foi possível atualizar o processo. Tente novamente.');
    }
  }catch(e){
    console.error(e);
    toast('Não foi possível enviar o arquivo. Tente novamente.');
  }
}

      '<div class="panel-body">'+
        '<p style="color:var(--ink-soft); font-size:.9rem; line-height:1.55;">Você está prestes a desistir do processo <strong>'+esc(s.nome)+'</strong>. Esta ação não pode ser desfeita pelo portal.</p>'+
        '<div class="obs-note" style="background:var(--danger-bg); border:1px solid var(--danger); color:var(--ink);">Lembre-se: em caso de desistência de processo já iniciado, <strong class="txt-danger-strong">as taxas pagas não são reembolsáveis e o valor do serviço não é devolvido</strong>.</div>'+
        '<div id="desistir-erro" class="obs-note" style="display:none; background:var(--danger-bg); border:1px solid var(--danger); color:var(--ink);"></div>'+

      '</div>'+

    '</div>'+

async function confirmarDesistencia(id){
  var p = state.processes.filter(function(x){return x.id===id;})[0];
  var textarea = document.getElementById('desistir-justificativa');
  var justificativa = textarea ? textarea.value.trim() : '';
  var errBox = document.getElementById('desistir-erro');
  if(!justificativa){
    if(errBox){ errBox.textContent = 'Por favor, informe a justificativa do motivo da desistência.'; errBox.style.display='block'; }
    return;
  }
  var statusAnterior = p.status;
  p.status = 'cancelado';
  p.historico.push({data:todayISO(), hora:nowHM(), texto:'Cliente solicitou a desistência do processo. Motivo: '+justificativa+'.', autor:'cliente'});
  saveState();
  closePanel();
  render();
  var ok = await salvarProcessoNoServidor(p);
  if(ok){
    toast('Desistência registrada.');
  } else {
    p.status = statusAnterior;
    p.historico.pop();
    saveState();
    render();
    toast('Não foi possível registrar a desistência. Verifique sua internet e tente novamente.');
  }
}
async function atribuirResponsavel(id, userId){
  var p = state.processes.filter(function(x){return x.id===id;})[0];
  if(!p) return;
  var anterior = p.responsavelId;
  p.responsavelId = userId || null;
  saveState();
  render();
  var u = userId ? getUser(userId) : null;
  var ok = await salvarProcessoNoServidor(p);
  if(ok){
    toast(u ? ('Processo atribuído a '+u.nome+'.') : 'Responsável removido do processo.');
  } else {
    p.responsavelId = anterior;
    saveState();
    render();
    toast('Não foi possível atribuir o responsável. Verifique sua internet e tente novamente.');
  }
}
async function enviarObservacaoCliente(id){
  var p = state.processes.filter(function(x){return x.id===id;})[0];
  if(!p) return;
  var textarea = document.getElementById('obs-cliente-'+id);
  var texto = textarea ? textarea.value.trim() : '';
  var errBox = document.getElementById('obs-cliente-erro-'+id);
  if(!texto){
    if(errBox){ errBox.textContent = 'Escreva sua observação antes de enviar.'; errBox.style.display='block'; }

function proximaEtapaLabel(p){
  var s = SERVICE_MAP[p.servicoId];
  if(p.status==='aguardando_pagamento') return s.etapas[0];
  if(p.etapaAtual < s.etapas.length-1) return s.etapas[p.etapaAtual+1];
  return null;
}
function etapaExigePendencias(label){
  return !!label && label.toLowerCase().indexOf('complemento')!==-1;
}
function avancarEtapa(id){
  var p = state.processes.filter(function(x){return x.id===id;})[0];
  var proxLabel = proximaEtapaLabel(p);
  if(etapaExigePendencias(proxLabel)){ abrirModalComplemento(id); return; }
  executarAvancoEtapa(id, null);
}
async function executarAvancoEtapa(id, pendenciasTexto){
  var p = state.processes.filter(function(x){return x.id===id;})[0];
  var s = SERVICE_MAP[p.servicoId];
  var snapshot = JSON.parse(JSON.stringify(p));
  var sufixoPendencias = pendenciasTexto ? ' Informações pendentes: '+pendenciasTexto : '';
  if(p.status==='aguardando_pagamento'){
    p.status='em_andamento'; p.etapaAtual=0;
    p.historico.push({data:todayISO(), hora:nowHM(), texto:'Pagamento confirmado. Processo iniciado — '+s.etapas[0]+'.'+sufixoPendencias, autor:'lucralize'});
  } else if(p.etapaAtual < s.etapas.length-1){
    p.etapaAtual++;
    var chegouAoFim = p.etapaAtual===s.etapas.length-1;
    p.historico.push({data:todayISO(), hora:nowHM(), texto: s.etapas[p.etapaAtual]+'.'+sufixoPendencias+(chegouAoFim?' Processo concluído! 🎉':''), autor:'lucralize'});
    if(chegouAoFim){
      p.status='concluido';
      if(!p.documentosFinais.length) p.documentosFinais.push({nome:s.nome+' - Documento Final.pdf'});
    }
  }
  saveState();
  closePanel();
  render();
  var ok = await salvarProcessoNoServidor(p);
  if(ok){
    toast('Etapa atualizada — o cliente já vê a atualização no portal dele.');
  } else {
    Object.assign(p, snapshot);
    saveState();
    render();
    toast('Não foi possível atualizar a etapa. Verifique sua internet e tente novamente.');
  }
}

async function confirmarReiniciarProcesso(id){
  var p = state.processes.filter(function(x){return x.id===id;})[0];
  var s = SERVICE_MAP[p.servicoId];
  var radio = document.querySelector('input[name="reiniciar-etapa"]:checked');
  var errBox = document.getElementById('reiniciar-erro');
  if(!radio){
    if(errBox){ errBox.textContent = 'Selecione para qual etapa o processo deve voltar.'; errBox.style.display='block'; }
    return;
  }
  var snapshot = JSON.parse(JSON.stringify(p));
  var idx = parseInt(radio.value, 10);
  var statusAnterior = p.status;
  if(idx===-1){
    p.status='aguardando_pagamento'; p.etapaAtual=-1;
  } else {
    p.status='em_andamento'; p.etapaAtual=idx;
  }
  var label = idx===-1 ? 'Pagamento confirmado' : s.etapas[idx];
  p.historico.push({data:todayISO(), hora:nowHM(), texto:'Processo reiniciado manualmente pela equipe Lucralize para a etapa: '+label+'.'+(statusAnterior!==p.status?' (status anterior: '+statusLabel(statusAnterior)+')':''), autor:'lucralize'});
  saveState();
  closePanel();
  render();
  var ok = await salvarProcessoNoServidor(p);
  if(ok){
    toast('Processo reiniciado para: '+label+'.');
  } else {
    Object.assign(p, snapshot);
    saveState();
    render();
    toast('Não foi possível reiniciar o processo. Verifique sua internet e tente novamente.');
  }
}
async function anexarDocumento(id, categoria){
  var p = state.processes.filter(function(x){return x.id===id;})[0];
  var input = document.getElementById('anexo-'+categoria+'-'+id);
  if(!p || !input || !input.files || !input.files[0]) return;
  var file = input.files[0];
  var campo = categoria==='andamento' ? 'documentosAndamento' : 'documentosFinais';
  var subpasta = categoria==='andamento' ? 'andamento' : 'finais';
  toast('Enviando arquivo...');
  try{
    var doc = await uploadArquivoReal(file, id, subpasta);
    var snapshot = JSON.parse(JSON.stringify(p));
    p[campo].push(doc);
    saveState(); render();
    var ok = await salvarProcessoNoServidor(p);
    if(ok){
      toast('Documento '+(categoria==='andamento'?'de andamento':'final')+' anexado.');
    } else {
      Object.assign(p, snapshot);
      saveState();
      render();
      toast('O arquivo foi enviado, mas não foi possível atualizar o processo. Tente novamente.');
    }
  }catch(e){
    console.error(e);
    toast('Não foi possível enviar o arquivo. Tente novamente.');
  }
}

async function excluirProcessoNoServidor(id){
  try{
    await comRetentativa(async function(){
      var res = await supa.from('processos').delete().eq('id', id).select();
      if(res.error) throw res.error;
      if(!res.data || !res.data.length) throw new Error('Nenhum processo excluído (0 linhas afetadas — verifique permissões).');
    });
    return true;
  }catch(e){
    console.error('Erro ao excluir processo no Supabase:', e);
    return false;
  }
}
async function liberarNumeroOS(osNumero){
  try{
    await comRetentativa(async function(){
      var res = await supa.rpc('liberar_numero_os', {os_numero: osNumero});
      if(res.error) throw res.error;
    });
    return true;
  }catch(e){
    console.error('Erro ao liberar número de OS para reuso:', e);
    return false;
  }
}

  if(nota) nota.style.display = ehTeste ? 'block' : 'none';

async function confirmarExcluirProcesso(id){
  var p = state.processes.filter(function(x){return x.id===id;})[0];
  if(!p) return;
  var textarea = document.getElementById('excluir-justificativa');
  var justificativa = textarea ? textarea.value.trim() : '';
  var errBox = document.getElementById('excluir-erro');
  var ehTeste = !!(document.getElementById('excluir-e-teste') && document.getElementById('excluir-e-teste').checked);
  if(!ehTeste && !justificativa){ if(errBox){ errBox.textContent='Descreva a justificativa da exclusão antes de continuar.'; errBox.style.display='block'; } return; }
  var btn = document.getElementById('excluir-confirmar-btn');
  if(btn){ btn.disabled = true; btn.textContent = 'Excluindo…'; }

  var ok = await excluirProcessoNoServidor(id);
  if(!ok){
    if(btn){ btn.disabled = false; btn.textContent = 'Excluir processo'; }
    if(errBox){ errBox.textContent='Não foi possível excluir o processo agora. Verifique sua internet e tente novamente.'; errBox.style.display='block'; }
    return;
  }

  if(!ehTeste){
    var autor = currentUser();
    var s = SERVICE_MAP[p.servicoId] || {nome:'Serviço não identificado'};
    if(!state.processosExcluidos) state.processosExcluidos = [];
    state.processosExcluidos.push({
      id:'x'+Date.now(),
      servicoNome:s.nome,
      empresaNome:nomeParaProcesso(p),
      ordemServico:p.ordemServico||null,
      justificativa:justificativa,
      excluidoPor: autor ? autor.nome : '—',
      data:todayISO(),
      hora:nowHM()
    });
  }
  state.processes = state.processes.filter(function(x){return x.id!==id;});
  saveState();
  closePanel();
  go({name:'admin-processos'});

  if(ehTeste && p.ordemServico){
    var liberou = await liberarNumeroOS(p.ordemServico);
    toast(liberou
      ? ('Processo excluído — o número '+p.ordemServico+' já está disponível para reuso.')
      : 'Processo excluído, mas não foi possível liberar o número da OS para reuso agora.');
  } else if(ehTeste){
    toast('Processo de teste excluído.');
  } else {
    toast('Processo excluído — motivo e responsável registrados em Processos excluídos.');
  }
}

async function confirmarIncluirProcessoManual(){
  var empresaSel = document.getElementById('manual-empresa').value;
  var servicoId = document.getElementById('manual-servico').value;
  var etapaVal = document.getElementById('manual-etapa').value;
  var dataAbertura = document.getElementById('manual-data').value || todayISO();
  var errBox = document.getElementById('manual-erro');

  var empresaId;
  if(empresaSel==='__nova__'){
    var nome = document.getElementById('manual-empresa-nome').value.trim();
    if(!nome){ if(errBox){errBox.textContent='Informe a razão social da nova empresa.'; errBox.style.display='block';} return; }
    var cnpj = document.getElementById('manual-empresa-cnpj').value.trim();
    var tipo = document.getElementById('manual-empresa-tipo').value.trim() || 'LTDA';
    var divisaoNova = document.getElementById('manual-empresa-divisao').value;
    empresaId = 'c'+Date.now();
    state.companies.push({id:empresaId, nome:nome, cnpj:cnpj||'—', tipo:tipo, divisao:divisaoNova});
  } else {
    empresaId = empresaSel;
  }

  var s = SERVICE_MAP[servicoId];
  var status, etapaAtual;
  if(etapaVal==='aguardando_pagamento'){ status='aguardando_pagamento'; etapaAtual=-1; }
  else if(etapaVal==='concluido'){ status='concluido'; etapaAtual=s.etapas.length-1; }
  else { status='em_andamento'; etapaAtual=parseInt(etapaVal,10); }

  var id = 'p'+Date.now();
  var arquivo;
  try{
    arquivo = await fabArquivoReal('manual-formulario', id, 'andamento');
  }catch(e){
    console.error(e);
    toast('Não foi possível enviar o arquivo. Tente novamente.');
    return;
  }

  var empresaObj = getCompany(empresaId);
  var processo = {
    id:id, servicoId:servicoId, status:status, etapaAtual:etapaAtual,
    criadoEm: dataAbertura, protocolo:'',
    historico:[{data:dataAbertura, hora:nowHM(), texto:'Processo incluído manualmente pela equipe Lucralize a partir de um registro anterior a este portal.'+(arquivo?' Documento original anexado: '+arquivo.nome+'.':''), autor:'lucralize'}],
    documentosAndamento: arquivo ? [arquivo] : [],
    documentosFinais: (status==='concluido' && s.etapas.length) ? [{nome:s.nome+' - Documento Final.pdf'}] : [],
    formularioManual: {arquivo:arquivo||null},
    empresaId: empresaId,
    divisao: empresaObj ? (empresaObj.divisao || null) : null,
    ordemServico: await gerarOrdemServico()
  };

  var salvo = await salvarProcessoNoServidor(processo);
  if(!salvo){
    toast('Não foi possível salvar o processo. Verifique sua internet e tente novamente.');
    return;
  }
  state.processes.push(processo);
  saveState();
  closePanel();
  render();
  toast('Processo incluído manualmente — '+processo.ordemServico+'.');
}

async function criarUsuario(){
  var tipoAcesso = (document.querySelector('input[name="nu-tipo-acesso"]:checked')||{}).value || 'cliente';
  var nome = document.getElementById('nu-nome').value.trim();
  var email = document.getElementById('nu-email').value.trim();
  var telefone = document.getElementById('nu-telefone').value.trim();
  if(!nome || !email){ toast('Preencha ao menos nome completo e e-mail.'); return; }

  var btnCriar = document.querySelector('.panel-foot .btn-primary, .panel-foot .btn-teal');
  if(btnCriar){ btnCriar.disabled = true; btnCriar.textContent = 'Criando…'; }
  function falhou(msg){
    if(btnCriar){ btnCriar.disabled = false; btnCriar.textContent = 'Criar acesso'; }
    toast('Não foi possível criar o acesso: '+msg);
  }

  if(tipoAcesso==='cliente'){
    var empresa = document.getElementById('nu-empresa').value.trim();
    var cnpj = document.getElementById('nu-cnpj').value.trim();
    var tipo = document.getElementById('nu-tipo').value.trim() || 'LTDA';
    if(!empresa){ toast('Preencha a razão social da empresa.'); if(btnCriar){ btnCriar.disabled=false; btnCriar.textContent='Criar acesso'; } return; }
    var cid = 'c'+Date.now();
    var empresaNova = {id:cid, nome:empresa, cnpj:cnpj||'—', tipo:tipo};
    var insEmpresa = await supa.from('empresas').insert(empresaParaRow(empresaNova));
    if(insEmpresa.error){ falhou(insEmpresa.error.message); return; }
    var funcRespCliente = await supa.functions.invoke('criar-usuario', {body:{nome:nome, email:email, telefone:telefone, role:'cliente', empresaId:cid}});
    if(funcRespCliente.error || (funcRespCliente.data && funcRespCliente.data.erro)){
      falhou(funcRespCliente.error ? funcRespCliente.error.message : funcRespCliente.data.erro);
      return;
    }
    state.companies.push(empresaNova);
    state.users.push({id:funcRespCliente.data.id, nome:nome, email:email, telefone:telefone||'—', role:'cliente', empresaId:cid, senhaProvisoria:true});
    saveState();
    closePanel();
    render();
    abrirModalAcessoCriado(nome, email, funcRespCliente.data.senha);
    return;
  }

  var permissoesNovoUsuario = null;
  if(tipoAcesso==='colaborador' || tipoAcesso==='freelancer'){
    permissoesNovoUsuario = {};
    PERMISSOES_COLABORADOR.forEach(function(pm){
      var el = document.getElementById('nu-perm-'+pm.id);
      permissoesNovoUsuario[pm.id] = !!(el && el.checked);
    });
  }
  var funcResp = await supa.functions.invoke('criar-usuario', {body:{nome:nome, email:email, telefone:telefone, role:tipoAcesso, empresaId:null, permissoes:permissoesNovoUsuario}});
  if(funcResp.error || (funcResp.data && funcResp.data.erro)){
    falhou(funcResp.error ? funcResp.error.message : funcResp.data.erro);
    return;
  }
  var novoUsuario = {id:funcResp.data.id, nome:nome, email:email, telefone:telefone||'—', role: tipoAcesso, empresaId:null, senhaProvisoria:true};
  if(permissoesNovoUsuario) novoUsuario.permissoes = permissoesNovoUsuario;
  state.users.push(novoUsuario);
  saveState();
  closePanel();
  render();
  abrirModalAcessoCriado(nome, email, funcResp.data.senha);
}

        '<div class="info-grid" style="grid-template-columns:1fr;">'+
          '<div class="info-block"><span class="lbl">E-mail de acesso</span><span class="val mono">'+esc(email)+'</span></div>'+
          '<div class="info-block"><span class="lbl">Senha provisória</span><span class="val mono" style="font-size:1.1rem; letter-spacing:.05em;">'+esc(senha)+'</span></div>'+
        '</div>'+
        '<div class="obs-note">Esta senha provisória só aparece uma vez, nesta tela — copie e envie com segurança para a pessoa. No primeiro acesso, será pedido para trocar a senha.</div>'+

      '<div class="panel-foot"><button class="btn btn-primary" onclick="PS.closePanel()">Entendi</button></div>'+
    '</div>'+
  '</div>';
  document.body.insertAdjacentHTML('beforeend', html);
}
