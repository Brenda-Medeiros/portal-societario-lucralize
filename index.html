<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Societário — Lucralize</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Poppins:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#F5F7F8;
    --surface:#FFFFFF;
    --surface-2:#EDF2F4;
    --surface-3:#E1E8EB;
    --ink:#17202B;
    --ink-soft:#57626F;
    --ink-faint:#8B96A2;
    --primary:#0C7488;
    --primary-strong:#095668;
    --primary-soft:#E1F0F2;
    --chrome:#0E1428;
    --chrome-strong:#080B15;
    --brand-cyan:#92DCE5;
    --success:#2F7D5D;
    --success-bg:#E4F3EC;
    --warning:#B4650B;
    --warning-bg:#FBEEE0;
    --danger:#F72642;
    --danger-bg:#FDE9EC;
    --border:#DEE4E8;
    --shadow:0 1px 2px rgba(15,25,45,.04), 0 8px 24px -12px rgba(15,25,45,.18);
    --radius-s:8px;
    --radius-m:12px;
    --radius-l:18px;
    --font-display:'Comfortaa', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-body:'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono:'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0B0F17;
      --surface:#121826;
      --surface-2:#1A2231;
      --surface-3:#232C3D;
      --ink:#E8EDF3;
      --ink-soft:#A7B2C2;
      --ink-faint:#6E7A8C;
      --primary:#4FC3D6;
      --primary-strong:#8FE0EC;
      --primary-soft:#153A42;
      --success:#6BCBA1;
      --success-bg:#173229;
      --warning:#E5A660;
      --warning-bg:#3A2712;
      --danger:#FF7A90;
      --danger-bg:#3D1620;
      --border:#2A3341;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0B0F17;
    --surface:#121826;
    --surface-2:#1A2231;
    --surface-3:#232C3D;
    --ink:#E8EDF3;
    --ink-soft:#A7B2C2;
    --ink-faint:#6E7A8C;
    --primary:#4FC3D6;
    --primary-strong:#8FE0EC;
    --primary-soft:#153A42;
    --success:#6BCBA1;
    --success-bg:#173229;
    --warning:#E5A660;
    --warning-bg:#3A2712;
    --danger:#FF7A90;
    --danger-bg:#3D1620;
    --border:#2A3341;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.6);
    color-scheme: dark;
  }

  *{box-sizing:border-box; min-width:0;}
  html, body{overflow-x:hidden; max-width:100%;}
  body{background:var(--bg); color:var(--ink); font-family:var(--font-body); margin:0; -webkit-font-smoothing:antialiased;}
  h1,h2,h3,h4{font-family:var(--font-body); font-weight:600; margin:0; text-wrap:balance; color:var(--ink);}
  p{margin:0;}
  button{font-family:inherit; cursor:pointer;}
  ::selection{background:var(--primary-soft); color:var(--primary-strong);}
  a{color:inherit;}
  .mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
  .u-scroll-x{overflow-x:auto;}
  button:focus-visible, a:focus-visible, input:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--primary); outline-offset:2px; border-radius:4px;
  }
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

  /* ---------- Buttons ---------- */
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:.5em; padding:.65em 1.1em; border-radius:var(--radius-s); border:1px solid transparent; font-size:.92rem; font-weight:600; line-height:1; transition:transform .12s ease, box-shadow .12s ease, background .12s ease;}
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--chrome); color:#fff;}
  .btn-primary:hover{background:var(--chrome-strong);}
  .btn-teal{background:var(--primary); color:#fff;}
  .btn-teal:hover{background:var(--primary-strong);}
  .btn-accent{background:var(--primary-soft); color:var(--primary-strong); border-color:var(--primary);}
  .btn-accent:hover{background:var(--primary); color:#fff;}
  .btn-ghost{background:transparent; color:var(--ink); border-color:var(--border);}
  .btn-ghost:hover{background:var(--surface-2);}
  .btn-subtle{background:var(--surface-2); color:var(--ink);}
  .btn-subtle:hover{background:var(--surface-3);}
  .btn-danger{background:transparent; color:var(--danger); border-color:var(--border);}
  .btn-danger:hover{background:var(--danger-bg);}
  .btn-block{width:100%;}
  .btn-sm{padding:.45em .8em; font-size:.82rem;}
  .btn[disabled]{opacity:.5; cursor:not-allowed;}

  /* ---------- Login screen ---------- */
  .login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem; background:
    radial-gradient(1200px 600px at 15% -10%, var(--primary-soft), transparent 60%),
    radial-gradient(900px 500px at 110% 10%, var(--primary-soft), transparent 55%),
    var(--bg);}
  .login-grid{display:grid; grid-template-columns:1.05fr 1fr; gap:0; max-width:960px; width:100%; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-l); overflow:hidden; box-shadow:var(--shadow);}
  .login-pitch{
    background:
      radial-gradient(1100px 720px at 6% -8%, rgba(12,116,136,.9), transparent 55%),
      radial-gradient(820px 620px at 46% 18%, rgba(12,116,136,.4), transparent 62%),
      linear-gradient(155deg, var(--chrome) 0%, var(--chrome-strong) 78%);
    color:#fff; padding:2.8rem 2.4rem; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:1.9rem;
  }
  .login-pitch .brand-logo{height:38px; width:auto; display:block; margin:0 auto;}
  .login-pitch h1{color:#fff; font-size:1.05rem; font-weight:500; line-height:1.5; max-width:320px; color:rgba(255,255,255,.85);}
  .login-pitch p{color:rgba(255,255,255,.78); font-size:.93rem; line-height:1.55;}
  .login-features{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:.7rem; width:100%; max-width:320px;}
  .login-features li{display:flex; align-items:center; gap:.85rem; padding:.8rem .95rem; border-radius:var(--radius-m); background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14); text-align:left;}
  .login-features .ic{width:36px; height:36px; border-radius:10px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.16); display:flex; align-items:center; justify-content:center; flex:none; font-size:1rem; color:var(--brand-cyan);}
  .login-features .txt{font-size:.83rem; font-weight:600; color:rgba(255,255,255,.92); line-height:1.35;}
  .login-form-side{padding:2.6rem 2.4rem; display:flex; flex-direction:column; gap:1.4rem;}
  .proto-badge{align-self:flex-start; font-size:.68rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--primary-strong); background:var(--primary-soft); padding:.3em .7em; border-radius:999px;}
  .field{display:flex; flex-direction:column; gap:.4rem;}
  .field label{font-size:.78rem; font-weight:600; color:var(--ink-soft);}
  .field input, .field textarea, .field select{padding:.65em .8em; border-radius:var(--radius-s); border:1px solid var(--border); background:var(--surface); color:var(--ink); font-size:.92rem; font-family:inherit;}
  .field textarea{resize:vertical; line-height:1.5;}
  .field input:disabled{color:var(--ink-faint);}
  .login-form-side .field label{font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-faint);}
  .login-form-side .field input{padding:.8em .9em; font-size:.95rem;}
  .link-esqueci{background:none; border:none; padding:.2rem; color:var(--primary); font-size:.85rem; font-weight:600; font-family:inherit; cursor:pointer; text-align:center;}
  .link-esqueci:hover{text-decoration:underline; color:var(--primary-strong);}

  .q-block{display:flex; flex-direction:column; gap:.6rem; padding:1.05rem 1.1rem; border:1px solid var(--border); border-radius:var(--radius-m); background:var(--surface-2);}
  .q-block .q-title{font-size:.9rem; font-weight:700; color:var(--ink); line-height:1.4;}
  .q-block .q-num{color:var(--primary); margin-right:.35em;}
  .obs-note{font-size:.78rem; color:var(--ink-soft); line-height:1.55; background:var(--primary-soft); padding:.65rem .8rem; border-radius:var(--radius-s); white-space:pre-line;}
  .obs-note strong{color:var(--ink);}
  .txt-danger-strong{color:var(--danger); font-weight:800;}
  .radio-group{display:flex; flex-direction:column; gap:.5rem;}
  .radio-option{display:flex; align-items:flex-start; gap:.6rem; padding:.65rem .8rem; border:1px solid var(--border); border-radius:var(--radius-s); background:var(--surface); cursor:pointer; font-size:.86rem; line-height:1.4;}
  .radio-option:has(input:checked){border-color:var(--primary); background:var(--primary-soft);}
  .radio-option input{margin-top:.2rem; flex:none;}
  .socio-block{border:1px dashed var(--border); border-radius:var(--radius-m); padding:1rem 1.1rem; display:flex; flex-direction:column; gap:.8rem; background:var(--surface);}
  .socio-block .socio-head{font-size:.78rem; font-weight:700; color:var(--primary-strong); text-transform:uppercase; letter-spacing:.05em;}
  .req-mark{color:var(--danger); margin-left:.2em;}

  .upload-list{display:flex; flex-direction:column; gap:.6rem;}
  .upload-row{display:flex; align-items:center; justify-content:space-between; gap:.8rem; padding:.65rem .85rem; border:1px solid var(--border); border-radius:var(--radius-s); background:var(--surface-2);}
  .upload-row.attached{border-color:var(--success); background:var(--success-bg);}
  .upload-row-label{display:flex; align-items:center; gap:.55rem; font-size:.84rem; font-weight:500; min-width:0;}
  .upload-row .req-dot{width:6px; height:6px; border-radius:50%; background:var(--ink-faint); flex:none;}
  .upload-row.attached .req-dot{background:var(--success);}
  .file-picker{display:flex; align-items:center; gap:.4em; padding:.4em .8em; border-radius:var(--radius-s); background:var(--surface); border:1px solid var(--border); font-size:.78rem; font-weight:600; color:var(--ink-soft); flex:none; white-space:nowrap; max-width:170px; overflow:hidden; text-overflow:ellipsis; cursor:pointer;}
  .file-picker:hover{border-color:var(--primary); color:var(--primary);}
  .upload-row.attached .file-picker{color:var(--success); border-color:var(--success);}
  .file-picker .txt{overflow:hidden; text-overflow:ellipsis;}
  .divider-label{display:flex; align-items:center; gap:.75rem; color:var(--ink-faint); font-size:.72rem; letter-spacing:.06em; text-transform:uppercase;}
  .divider-label::before, .divider-label::after{content:''; flex:1; height:1px; background:var(--border);}
  .demo-list{display:flex; flex-direction:column; gap:.55rem;}
  .demo-card{display:flex; align-items:center; gap:.75rem; text-align:left; padding:.7rem .8rem; border-radius:var(--radius-s); border:1px solid var(--border); background:var(--surface);}
  .demo-card:hover{border-color:var(--primary); background:var(--primary-soft);}
  .demo-avatar{width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.78rem; flex:none;}
  .demo-meta{display:flex; flex-direction:column; gap:.1rem; min-width:0;}
  .demo-meta strong{font-size:.86rem;}
  .demo-meta span{font-size:.75rem; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .role-chip{margin-left:auto; font-size:.65rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; padding:.25em .55em; border-radius:999px; flex:none;}
  .role-chip.cliente{background:var(--primary-soft); color:var(--primary);}
  .role-chip.admin{background:var(--chrome); color:#fff;}
  .role-chip.colaborador{background:var(--warning-bg); color:var(--warning);}
  .role-chip.freelancer{background:var(--success-bg); color:var(--success);}

  /* ---------- App shell ---------- */
  .shell{display:grid; grid-template-columns:248px 1fr; min-height:100vh;}
  .sidebar{background:var(--chrome-strong); color:#fff; display:flex; flex-direction:column; padding:1.4rem 1.1rem; gap:1.6rem; position:sticky; top:0; min-height:100vh;}
  .brand{display:flex; flex-direction:column; align-items:center; text-align:center; gap:.65rem; padding:.4rem .3rem .6rem;}
  .brand .brand-logo{height:34px; width:auto; display:block; margin:0 auto;}
  .brand .brand-caption{font-family:var(--font-display); font-weight:700; font-size:.86rem; letter-spacing:.12em; text-transform:uppercase; color:rgba(255,255,255,.72);}
  .nav-group{display:flex; flex-direction:column; gap:.2rem;}
  .nav-label{font-size:.66rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:rgba(255,255,255,.45); padding:.4rem .6rem 0;}
  .nav-item{display:flex; align-items:center; gap:.65rem; padding:.6rem .7rem; border-radius:var(--radius-s); color:rgba(255,255,255,.82); font-size:.87rem; font-weight:500; background:transparent; border:none; text-align:left; width:100%;}
  .nav-item .ic{width:18px; text-align:center; flex:none;}
  .nav-item:hover{background:rgba(255,255,255,.08); color:#fff;}
  .nav-item.active{background:rgba(255,255,255,.14); color:#fff; font-weight:600;}
  .nav-item.active::before{content:''; }
  .sidebar-foot{margin-top:auto; display:flex; flex-direction:column; gap:.6rem; border-top:1px solid rgba(255,255,255,.14); padding-top:1rem;}
  .user-pill{display:flex; align-items:center; gap:.6rem;}
  .user-pill .demo-avatar{background:rgba(255,255,255,.16); color:#fff;}
  .user-pill .who{min-width:0;}
  .user-pill .who strong{display:block; font-size:.82rem; color:#fff; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .user-pill .who span{font-size:.72rem; color:rgba(255,255,255,.6);}

  .main{min-width:0;}
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:1.1rem 2rem; border-bottom:1px solid var(--border); background:var(--surface); position:sticky; top:0; z-index:5;}
  .topbar h2{font-size:1.15rem;}
  .topbar .crumb{font-size:.76rem; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.08em; margin-bottom:.15rem;}
  .content{padding:1.8rem 2.4rem 3rem; max-width:1560px;}

  .theme-toggle{display:flex; gap:.25rem; background:var(--surface-2); border-radius:999px; padding:.2rem;}
  .theme-toggle button{border:none; background:transparent; padding:.35em .6em; border-radius:999px; font-size:.75rem; color:var(--ink-soft);}
  .theme-toggle button.active{background:var(--surface); color:var(--ink); box-shadow:var(--shadow);}

  /* ---------- Generic pieces ---------- */
  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m); box-shadow:var(--shadow);}
  .section-title{display:flex; align-items:baseline; justify-content:space-between; gap:1rem; margin-bottom:1rem;}
  .section-title h3{font-size:1.05rem;}
  .eyebrow{font-size:.68rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint);}

  .pill{display:inline-flex; align-items:center; gap:.4em; font-size:.72rem; font-weight:700; letter-spacing:.02em; padding:.3em .65em; border-radius:999px; white-space:nowrap;}
  .pill-dot{width:6px; height:6px; border-radius:50%; background:currentColor;}
  .pill.status-aguardando_pagamento{background:var(--warning-bg); color:var(--warning);}
  .pill.status-em_andamento{background:var(--primary-soft); color:var(--primary);}
  .pill.status-concluido{background:var(--success-bg); color:var(--success);}
  .pill.status-cancelado{background:var(--danger-bg); color:var(--danger);}
  .pill.tag-confirmado{background:var(--success-bg); color:var(--success);}
  .pill.tag-estimado{background:var(--warning-bg); color:var(--warning);}

  .kpi-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:1rem; margin-bottom:1.6rem;}
  .kpi{padding:1.1rem 1.2rem; display:flex; flex-direction:column; gap:.35rem;}
  .kpi .label{font-size:.74rem; color:var(--ink-soft); font-weight:600;}
  .kpi .value{font-family:var(--font-display); font-size:1.7rem; font-weight:700;}
  .kpi .sub{font-size:.72rem; color:var(--ink-faint);}

  .kpi-mes-head{display:flex; align-items:center; justify-content:space-between; gap:.5rem;}
  .kpi-mes-nav{display:flex; align-items:center; gap:.25rem; flex:none;}
  .kpi-mes-nav button{width:22px; height:22px; border-radius:6px; border:1px solid var(--border); background:var(--surface); color:var(--ink-soft); font-size:.85rem; line-height:1; display:flex; align-items:center; justify-content:center; padding:0;}
  .kpi-mes-nav button:hover{border-color:var(--primary); color:var(--primary);}
  .kpi-mes-nav button:disabled{opacity:.35; cursor:not-allowed;}
  .kpi-mes-nav button:disabled:hover{border-color:var(--border); color:var(--ink-soft);}

  .competencia-bar{display:flex; align-items:center; justify-content:space-between; gap:1rem; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m); padding:.7rem 1.1rem; margin-bottom:1.2rem;}
  .kpi-mes-nav-lg button{width:28px; height:28px; font-size:1rem;}
  .kpi-mes-nav-lg{gap:.7rem;}
  .competencia-label{font-family:var(--font-display); font-size:1rem; min-width:130px; text-align:center; color:var(--ink);}

  .kpi-grid.tipo-kpi-grid{grid-template-columns:repeat(4,1fr);}
  .tipo-kpi{text-align:left; width:100%; cursor:pointer; transition:border-color .12s ease, box-shadow .12s ease, background .12s ease;}
  .tipo-kpi:hover{border-color:var(--primary);}
  .tipo-kpi.active{border-color:var(--primary); background:var(--primary-soft); box-shadow:0 0 0 1px var(--primary) inset;}
  .tipo-kpi .label{display:flex; align-items:center; gap:.5rem;}
  .tipo-kpi-ic{width:26px; height:26px; border-radius:8px; background:var(--primary-soft); color:var(--primary-strong); display:flex; align-items:center; justify-content:center; font-size:.82rem; flex:none;}
  .tipo-kpi.active .tipo-kpi-ic{background:var(--primary); color:#fff;}
  @media (max-width:900px){ .kpi-grid.tipo-kpi-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:520px){ .kpi-grid.tipo-kpi-grid{grid-template-columns:1fr;} }

  .cat-block{margin-bottom:2.2rem;}
  .svc-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:1rem;}
  .svc-card{padding:1.15rem 1.2rem; display:flex; flex-direction:column; gap:.7rem; text-align:left; border:1px solid var(--border);}
  .svc-card:hover{border-color:var(--primary);}
  .svc-card .nome{font-size:1rem; font-family:var(--font-body); font-weight:600;}
  .svc-card .resumo{font-size:.82rem; color:var(--ink-soft); line-height:1.45;}
  .svc-card .preco-row{display:flex; align-items:baseline; justify-content:space-between; gap:.5rem; margin-top:auto; padding-top:.6rem; border-top:1px dashed var(--border);}
  .svc-card .preco{font-family:var(--font-mono); font-weight:600; font-size:1.02rem; color:var(--primary);}
  :root[data-theme="dark"] .svc-card .preco{color:var(--primary-strong);}
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .svc-card .preco{color:var(--primary-strong);} }
  .svc-card .preco small{display:block; font-family:var(--font-body); font-weight:500; font-size:.66rem; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em;}

  /* overlay / modal */
  .overlay{position:fixed; inset:0; background:rgba(10,15,25,.5); display:flex; justify-content:flex-end; z-index:50; animation:fade .15s ease;}
  @keyframes fade{from{opacity:0} to{opacity:1}}
  .panel{width:min(560px, 100%); height:100%; background:var(--surface); box-shadow:-16px 0 40px rgba(0,0,0,.2); display:flex; flex-direction:column; animation:slide .18s ease;}
  .panel-wide{width:min(860px, 96vw);}
  @keyframes slide{from{transform:translateX(24px); opacity:.6} to{transform:translateX(0); opacity:1}}
  .panel-head{padding:1.4rem 1.6rem 1rem; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; gap:1rem; align-items:flex-start;}
  .panel-body{padding:1.3rem 1.6rem 2rem; overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:1.4rem;}
  .panel-foot{padding:1rem 1.6rem; border-top:1px solid var(--border); display:flex; gap:.7rem; justify-content:flex-end;}
  .close-x{background:var(--surface-2); border:none; width:30px; height:30px; border-radius:50%; font-size:1rem; color:var(--ink-soft); flex:none;}
  .close-x:hover{background:var(--surface-3);}

  .modal-center{position:fixed; inset:0; background:rgba(10,15,25,.5); display:flex; align-items:center; justify-content:center; z-index:60; padding:1.5rem;}
  .modal-box{width:min(480px,100%); max-height:100%; background:var(--surface); border-radius:var(--radius-l); box-shadow:var(--shadow); overflow:hidden; display:flex; flex-direction:column;}
  .modal-box .panel-head, .modal-box .panel-body, .modal-box .panel-foot{padding-left:1.5rem; padding-right:1.5rem;}

  .info-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:.9rem;}
  .info-block{display:flex; flex-direction:column; gap:.3rem;}
  .info-block .lbl{font-size:.68rem; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-faint);}
  .info-block .val{font-size:.92rem; font-weight:600;}

  table{border-collapse:collapse; width:100%; font-size:.86rem;}
  th{text-align:left; font-size:.68rem; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); font-weight:700; padding:.6rem .8rem; border-bottom:1px solid var(--border);}
  td{padding:.75rem .8rem; border-bottom:1px solid var(--border); vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr.clickable:hover{background:var(--surface-2); cursor:pointer;}

  .price-table{width:100%; font-size:.83rem; border-collapse:collapse;}
  .price-table th, .price-table td{padding:.5rem .3rem; border-bottom:1px solid var(--border);}
  .price-table td.v{font-family:var(--font-mono); text-align:right; font-weight:600;}
  .price-table tr.mine{background:var(--primary-soft);}
  .price-table tr.mine td{font-weight:700;}

  .doc-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:.5rem;}
  .doc-list li{display:flex; gap:.6rem; align-items:flex-start; font-size:.86rem; line-height:1.4;}
  .doc-list li .ic{color:var(--primary); flex:none; margin-top:.15em;}

  .file-row{display:flex; align-items:center; gap:.7rem; padding:.7rem .85rem; border:1px solid var(--border); border-radius:var(--radius-s); background:var(--surface-2);}
  .file-row .ic{width:32px; height:32px; border-radius:8px; background:var(--primary-soft); color:var(--primary); display:flex; align-items:center; justify-content:center; flex:none; font-size:.85rem;}
  .file-row .name{font-size:.85rem; font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  /* stepper */
  .stepper{display:flex; flex-direction:column; gap:0;}
  .step{display:flex; gap:.9rem;}
  .step .rail{display:flex; flex-direction:column; align-items:center; flex:none;}
  .step .node{width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.72rem; font-weight:700; border:2px solid var(--border); background:var(--surface); color:var(--ink-faint); flex:none;}
  .step .line{width:2px; flex:1; background:var(--border); min-height:22px;}
  .step:last-child .line{display:none;}
  .step.concluida .node{background:var(--success); border-color:var(--success); color:#fff;}
  .step.concluida .line{background:var(--success);}
  .step.atual .node{background:var(--surface); border-color:var(--primary); color:var(--primary-strong); box-shadow:0 0 0 4px var(--primary-soft);}
  .step-body{padding-bottom:1.5rem; flex:1; min-width:0;}
  .step-body .title{font-size:.9rem; font-weight:600;}
  .step.pendente .step-body .title{color:var(--ink-faint); font-weight:500;}
  .step-body .when{font-size:.74rem; color:var(--ink-faint); margin-top:.1rem;}
  .step-body .note{font-size:.8rem; color:var(--ink-soft); margin-top:.35rem; background:var(--surface-2); padding:.55rem .7rem; border-radius:var(--radius-s);}

  .banner-proto{display:flex; align-items:center; gap:.6rem; background:var(--primary-soft); color:var(--primary-strong); padding:.55rem 1rem; border-radius:var(--radius-s); font-size:.78rem; font-weight:600; margin-bottom:1.4rem;}

  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:.9rem;}
  .form-grid .full{grid-column:1 / -1;}
  .filtro-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:.9rem;}
  @media (max-width:900px){ .filtro-grid{grid-template-columns:1fr 1fr;} }
  @media (max-width:560px){ .filtro-grid{grid-template-columns:1fr;} }

  th input.th-filtro, th select.th-filtro{display:block; width:100%; margin-top:.5rem; font-size:.76rem; font-weight:500; text-transform:none; letter-spacing:normal; color:var(--ink); padding:.4em .55em; border-radius:6px; border:1px solid var(--border); background:var(--surface); font-family:inherit;}

  .empty-state{display:flex; flex-direction:column; align-items:center; text-align:center; gap:.6rem; padding:3rem 1.5rem; color:var(--ink-soft);}

  @media (max-width: 880px){
    .shell{grid-template-columns:1fr;}
    .sidebar{position:relative; height:auto; flex-direction:row; align-items:center; flex-wrap:wrap;}
    .sidebar-foot{margin-top:0; margin-left:auto; border:none; padding:0;}
    .nav-group{flex-direction:row; flex-wrap:wrap;}
    .login-grid{grid-template-columns:1fr;}
    .login-pitch{display:none;}
    .kpi-grid{grid-template-columns:repeat(2,1fr);}
    .form-grid{grid-template-columns:1fr;}
    .content{padding:1.2rem;}
    .topbar{padding:1rem 1.2rem;}
  }
</style>
</head>

function sanitizeFileName(nome){
  return String(nome||'arquivo').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9.\-_]+/g,'_').slice(0,140);
}
/* Tenta novamente automaticamente (com pequenas pausas) antes de desistir —
   importante para conexões de internet instáveis (ex.: navegador embutido
   do WhatsApp em rede móvel), onde uma falha isolada não deve virar erro
   definitivo para o cliente. */
async function comRetentativa(fn, tentativas, delayMs){
  tentativas = tentativas || 3;
  delayMs = delayMs || 700;
  var ultimoErro;
  for(var i=0; i<tentativas; i++){
    try{
      return await fn();
    }catch(e){
      ultimoErro = e;
      if(i < tentativas-1) await new Promise(function(r){ setTimeout(r, delayMs*(i+1)); });
    }
  }
  throw ultimoErro;
}
async function uploadArquivoReal(file, processoId, subpasta){
  if(!file) return null;
  var path = processoId+'/'+subpasta+'/'+Date.now()+'-'+sanitizeFileName(file.name);
  return await comRetentativa(async function(){
    var up = await supa.storage.from(STORAGE_BUCKET).upload(path, file, {upsert:false});
    if(up.error) throw up.error;
    return {nome:file.name, path:path};
  });
}
async function baixarArquivoReal(path){
  if(!path){ toast('Arquivo não disponível para download.'); return; }
  try{
    var res = await supa.storage.from(STORAGE_BUCKET).createSignedUrl(path, 3600);
    if(res.error || !res.data){ toast('Não foi possível gerar o link de download.'); return; }
    window.open(res.data.signedUrl, '_blank');
  }catch(e){
    console.error(e);
    toast('Não foi possível gerar o link de download.');
  }
}

/* ---- conversão entre o formato usado no app (state.users/companies/processes)
   e as linhas das tabelas do Supabase (colunas indexadas + dados completos em JSONB,
   para não perder nenhum campo aninhado do protótipo original) ---- */
function usuarioParaRow(u){
  var dados = Object.assign({}, u);
  delete dados.senha;
  return {id:u.id, role:u.role, empresa_id:u.empresaId||null, senha_provisoria: !!u.senhaProvisoria, dados:dados};
}
function rowParaUsuario(row){
  var u = Object.assign({}, row.dados);
  u.id = row.id;
  u.role = row.role;
  u.empresaId = row.empresa_id;
  u.senhaProvisoria = row.senha_provisoria;
  return u;

function rowParaEmpresa(row){ var c = Object.assign({}, row.dados); c.id = row.id; return c; }
function processoParaRow(p){ return {id:p.id, empresa_id:p.empresaId||null, responsavel_id:p.responsavelId||null, dados:p}; }
function rowParaProcesso(row){ var p = Object.assign({}, row.dados); p.id = row.id; return p; }
function excluidoParaRow(x){ return {id:x.id, dados:x}; }
function rowParaExcluido(row){ var x = Object.assign({}, row.dados); x.id = row.id; return x; }

/* ---- envia para o Supabase tudo que está em memória; cada tabela é protegida
   por regras de segurança (RLS) próprias, então um erro de permissão em uma
   tabela (esperado para papéis sem acesso a ela) nunca interrompe as outras ---- */
function sincronizarSupabase(){
  var u = currentUser();
  if(state.processes && state.processes.length){
    supa.from('processos').upsert(state.processes.map(processoParaRow)).then(function(r){ if(r.error) console.warn('Sincronizar processos:', r.error.message); });
  }
  if(u && (u.role==='admin' || u.role==='colaborador')){
    if(state.processosExcluidos && state.processosExcluidos.length){
      supa.from('processos_excluidos').upsert(state.processosExcluidos.map(excluidoParaRow)).then(function(r){ if(r.error) console.warn('Sincronizar excluídos:', r.error.message); });
    }
    if(state.companies && state.companies.length){
      supa.from('empresas').upsert(state.companies.map(empresaParaRow)).then(function(r){ if(r.error) console.warn('Sincronizar empresas:', r.error.message); });
    }
  }
  if(u && u.role==='admin' && state.users && state.users.length){
    supa.from('usuarios').upsert(state.users.map(usuarioParaRow)).then(function(r){ if(r.error) console.warn('Sincronizar usuários:', r.error.message); });
  }
}

/* ---- carrega, a partir do Supabase, tudo que o usuário autenticado tem
   permissão de ver (o próprio banco já filtra por papel via RLS) ---- */
async function carregarDadosAutenticados(authUserId){
  var perfilResp = await supa.from('usuarios').select('*').eq('id', authUserId).single();
  if(perfilResp.error || !perfilResp.data) return false;
  var uPerfil = rowParaUsuario(perfilResp.data);
  var resultados = await Promise.all([
    supa.from('usuarios').select('*'),
    supa.from('empresas').select('*'),
    supa.from('processos').select('*'),
    supa.from('processos_excluidos').select('*')
  ]);
  state.users = (resultados[0].data||[]).map(rowParaUsuario);
  if(!state.users.some(function(x){ return x.id===uPerfil.id; })) state.users.push(uPerfil);
  state.companies = (resultados[1].data||[]).map(rowParaEmpresa);
  state.processes = (resultados[2].data||[]).map(rowParaProcesso);
  state.processosExcluidos = (resultados[3].data||[]).map(rowParaExcluido);
  var maiorOS = 0;
  state.processes.forEach(function(p){
    var m = /OS-(\d+)\//.exec(p.ordemServico||'');
    if(m){ var n = parseInt(m[1],10); if(n>maiorOS) maiorOS = n; }
  });
  state.nextOrdemSeq = maiorOS + 1;
  state.session = {userId: uPerfil.id};
  return true;
}

async function gerarOrdemServico(){
  /* número gerado de forma atômica no banco (sequence do Postgres), para que
     dois pedidos simultâneos — inclusive de visitantes sem login, que não têm
     como saber os números já usados por outras pessoas — nunca recebam o
     mesmo número de ordem de serviço. */
  try{
    var data = await comRetentativa(async function(){
      var res = await supa.rpc('gerar_ordem_servico');
      if(res.error) throw res.error;
      if(!res.data) throw new Error('RPC gerar_ordem_servico sem retorno');
      return res.data;
    });
    return data;
  }catch(e){
    console.error('Erro ao gerar número de ordem de serviço via RPC:', e);
  }
  /* fallback (só ocorre se a chamada ao banco falhar, ex.: sem internet) */
  var n = state.nextOrdemSeq++;
  var ano = new Date().getFullYear();
  return 'OS-'+String(n).padStart(3,'0')+'/'+ano;
}
function normalizarOS(str){
  var s = (str||'').trim().toUpperCase().replace(/\s+/g,'');
  if(s.indexOf('OS-')!==0) s = 'OS-'+s;
  var m = s.match(/^OS-(\d+)\/(\d{4})$/);
  if(m) return 'OS-'+m[1].padStart(3,'0')+'/'+m[2];
  return s;
}

async function salvarProcessoNoServidor(processo, ehNovo){
  /* ehNovo=true: criação de processo (finalizarNovoProcesso) — sempre grava
     direto na tabela por id, inclusive para visitante sem login (a política de
     RLS libera INSERT anônimo quando empresa_id é nulo).
     ehNovo falso/omitido: atualização de um processo JÁ existente. Se não há
     sessão autenticada (visitante do link público), a gravação direta por id
     seria bloqueada pela RLS (não existe política de UPDATE para o papel
     anônimo) — nesse caso usamos a RPC atualizar_processo_por_os, que localiza
     o processo exatamente pelo número da OS (a própria credencial pública).
     Em ambos os casos, checamos se alguma linha voltou no resultado: um
     upsert/RPC que a RLS filtra silenciosamente "funciona" sem erro, mas não
     grava nada — por isso 0 linhas retornadas também conta como falha. */
  try{
    if(!ehNovo && !state.session){
      if(!processo.ordemServico) throw new Error('Processo sem número de ordem de serviço.');
      await comRetentativa(async function(){
        var res = await supa.rpc('atualizar_processo_por_os', {os_numero: processo.ordemServico, novo_dados: processo});
        if(res.error) throw res.error;
        if(!res.data || !res.data.length) throw new Error('Nenhum processo atualizado (RPC atualizar_processo_por_os retornou vazio).');
      });
      return true;
    }
    await comRetentativa(async function(){
      var res = await supa.from('processos').upsert([processoParaRow(processo)]).select();
      if(res.error) throw res.error;
      if(!res.data || !res.data.length) throw new Error('Nenhum processo salvo (0 linhas afetadas — verifique permissões).');
    });
    return true;
  }catch(e){
    console.error('Erro ao salvar processo no Supabase:', e);
    return false;
  }
}
async function finalizarNovoProcesso(processo, toastLogado){
  var u = currentUser();
  processo.ordemServico = await gerarOrdemServico();
  if(u){
    processo.empresaId = u.empresaId;
    var empresa = getCompany(u.empresaId);
    processo.divisao = empresa ? (empresa.divisao || null) : null;
    var fa = processo.formularioAbertura;
    var telPessoal = (fa && fa.telefoneOpcao==='pessoal') ? fa.telefonePessoal : '';
    var emailPessoal = (fa && fa.emailOpcao==='pessoal') ? fa.emailPessoal : '';
    processo.solicitanteContato = {telefone: telPessoal || u.telefone || '', email: emailPessoal || u.email || ''};
  } else {
    processo.empresaId = null;
    processo.visitante = state.visitante ? {nome:state.visitante.nome, telefone:state.visitante.telefone, email:state.visitante.email} : null;
    processo.divisao = state.visitanteDivisao || null;
    processo.solicitanteContato = processo.visitante ? {telefone: processo.visitante.telefone||'', email: processo.visitante.email||''} : null;
  }

  /* salva de verdade no servidor ANTES de mostrar qualquer tela de sucesso —
     se a gravação falhar (sem internet, erro do Supabase, etc.), o cliente
     precisa ver isso e poder tentar de novo, em vez de receber uma
     confirmação falsa enquanto nada foi realmente registrado. */
  var salvoComSucesso = await salvarProcessoNoServidor(processo, true);
  if(!salvoComSucesso){
    toast('Não foi possível enviar sua solicitação. Verifique sua internet e tente novamente.');
    return false;
  }

  state.processes.push(processo);
  saveState();
  closePanel();
  if(u){
    go({name:'cliente-processos'});
    toast(toastLogado || 'Formulário enviado com sucesso! Você receberá o boleto em breve.');
  } else {
    go({name:'link-publico', etapa:'confirmacao', ordemServico:processo.ordemServico});
  }
  return true;
}

}

function priceForCompany(service, company){
  if(!service.precos) return null;
  if(service.precos.length===1) return service.precos[0];
  var match = company ? service.precos.filter(function(p){ return p.tipo===company.tipo; })[0] : null;
  return match || service.precos[0];
}
function stepStates(process, service){
  var steps = service.etapas;
  var out = [];
  for(var i=0;i<steps.length;i++){
    var st;
    if(process.status==='aguardando_pagamento'){ st = 'pendente'; }
    else if(process.status==='concluido'){ st = 'concluida'; }
    else if(i < process.etapaAtual){ st='concluida'; }
    else if(i === process.etapaAtual){ st='atual'; }
    else{ st='pendente'; }
    out.push({label:steps[i], state:st});
  }
  return out;
}

async function login(userId){

    state.session = null;
    state.view = {name:'login'};
    render();
    return;
  }
  var u = currentUser();
  var pendente = null;
  try{ pendente = localStorage.getItem(TROCAR_SENHA_PENDENTE_KEY); }catch(e){}
  if(pendente===u.id){
    state.view = {name:'trocar-senha-obrigatoria', userId:u.id, etapa:'definir-senha'};
  } else if(u.senhaProvisoria){
    state.view = {name:'trocar-senha-obrigatoria', userId:u.id, etapa:'enviar-link'};
  } else {
    state.view = {name: u.role==='freelancer' ? 'admin-processos' : ((u.role==='admin' || u.role==='colaborador') ? 'admin-overview' : 'cliente-processos')};
  }
  render();
}
function logout(){
  supa.auth.signOut();
  state.session=null;

async function boot(){
  if(state.view.name!=='carregando'){ render(); return; } /* link avulso via hash já definiu a view */
  try{
    var sessionResp = await supa.auth.getSession();
    var session = sessionResp.data && sessionResp.data.session;
    if(session){ await login(session.user.id); return; }
  }catch(e){ console.error(e); }
  state.view = {name:'login'};
  render();
}

function trocarSenhaEnviarLink(){
  var u = getUser(state.view.userId);
  if(!u){ state.view = {name:'login'}; render(); return; }
  var errBox = document.getElementById('trocar-senha-erro');
  function mostrarErro(msg){ if(errBox){ errBox.textContent = msg; errBox.style.display='block'; } }
  var btn = document.querySelector('.login-form-side .btn-teal');
  if(btn){ btn.disabled = true; }
  var redirectUrl = window.location.origin + window.location.pathname;
  supa.auth.signInWithOtp({email:u.email, options:{emailRedirectTo: redirectUrl}}).then(function(resp){
    if(btn){ btn.disabled = false; }
    if(resp.error){ mostrarErro('Não foi possível enviar o e-mail de confirmação. Tente novamente em instantes.'); return; }
    try{ localStorage.setItem(TROCAR_SENHA_PENDENTE_KEY, u.id); }catch(e){}
    state.view.etapa = 'aguardando-link';
    render();
    toast('Link de confirmação enviado para o seu e-mail.');
  });
}
function trocarSenhaReenviarLink(){
  trocarSenhaEnviarLink();
}
async function trocarSenhaDefinirSenha(){
  var novaInput = document.getElementById('trocar-senha-nova');
  var confirmaInput = document.getElementById('trocar-senha-confirma');
  var errBox = document.getElementById('trocar-senha-erro');
  var nova = novaInput ? novaInput.value : '';
  var confirma = confirmaInput ? confirmaInput.value : '';
  function mostrarErro(msg){ if(errBox){ errBox.textContent = msg; errBox.style.display='block'; } }
  if(!nova || nova.length<6){ mostrarErro('A nova senha precisa ter pelo menos 6 caracteres.'); return; }
  if(nova!==confirma){ mostrarErro('As senhas não coincidem.'); return; }
  var btn = document.querySelector('.login-form-side .btn-teal');
  if(btn){ btn.disabled = true; }
  var updResp = await supa.auth.updateUser({password: nova});
  if(updResp.error){
    if(btn){ btn.disabled = false; }
    mostrarErro('Não foi possível salvar a nova senha. Tente novamente.');
    return;
  }
  await supa.rpc('marcar_senha_alterada');
  try{ localStorage.removeItem(TROCAR_SENHA_PENDENTE_KEY); }catch(e){}
  toast('Senha alterada com sucesso. Bem-vindo(a)!');
  await login(updResp.data.user.id);
}
function trocarSenhaVoltarLogin(){
  try{ localStorage.removeItem(TROCAR_SENHA_PENDENTE_KEY); }catch(e){}
  supa.auth.signOut();
  state.session = null;
  state.view = {name:'login'};
  render();
}

async function linkPublicoAcompanharBuscar(){
  var input = document.getElementById('lp-os-input');
  var raw = (input.value||'').trim().toUpperCase();
  var errBox = document.getElementById('lp-acomp-erro');
  var btn = document.getElementById('lp-buscar-btn');
  if(!raw){ if(errBox){ errBox.textContent='Digite o número da ordem de serviço.'; errBox.style.display='block'; } return; }
  var norm = normalizarOS(raw);

  /* primeiro tenta localmente (processo que acabou de ser criado nesta mesma sessão) */
  var p = state.processes.filter(function(x){ return normalizarOS(x.ordemServico)===norm; })[0];

  if(!p){
    /* busca no servidor — necessário para quem está acompanhando de outro dispositivo
       ou depois de fechar o navegador, já que o número da OS é a própria credencial
       de acompanhamento (sem usuário e senha) */
    if(btn){ btn.disabled = true; btn.textContent = 'Buscando...'; }
    try{
      var res = await supa.rpc('buscar_processo_por_os', {os_numero: norm});
      if(!res.error && res.data && res.data.length){
        p = rowParaProcesso(res.data[0]);
        var jaExiste = state.processes.some(function(x){ return x.id===p.id; });
        if(!jaExiste) state.processes.push(p); else state.processes = state.processes.map(function(x){ return x.id===p.id ? p : x; });
      } else if(res.error){
        console.error('Erro ao buscar processo por OS:', res.error);
        if(btn){ btn.disabled = false; btn.textContent = 'Buscar processo'; }
        if(errBox){ errBox.textContent='Não foi possível buscar o processo agora. Verifique sua internet e tente novamente.'; errBox.style.display='block'; }
        return;
      }
    }catch(e){
      console.error('Erro ao buscar processo por OS:', e);
      if(btn){ btn.disabled = false; btn.textContent = 'Buscar processo'; }
      if(errBox){ errBox.textContent='Não foi possível buscar o processo agora. Verifique sua internet e tente novamente.'; errBox.style.display='block'; }
      return;
    }
    if(btn){ btn.disabled = false; btn.textContent = 'Buscar processo'; }
  }

  if(!p){
    if(errBox){ errBox.textContent='Nenhum processo encontrado com esse número de ordem de serviço. Confira e tente novamente.'; errBox.style.display='block'; }
    return;
  }
  if(errBox) errBox.style.display='none';
  go({name:'link-publico', etapa:'processo', id:p.id});
}

function renderShell(u){

  if(u.role==='freelancer'){
    items = [{k:'admin-processos', ic:'≣', label:'Processos'}];

      {k:'admin-processos', ic:'≣', label:'Processos'},
      {k:'admin-catalogo', ic:'▤', label:'Catálogo de serviços'}

    items.push({k:'admin-excluidos', ic:'🗑', label:'Processos excluídos'});
    if(u.role==='admin') items.push({k:'admin-usuarios', ic:'◎', label:'Usuários'});

    ];
  }

  if(u.role==='freelancer' && ['admin-overview','admin-catalogo','admin-usuarios','admin-excluidos'].indexOf(state.view.name)!==-1){

  }

  }).join('');

  var company = admin ? null : getCompany(u.empresaId);

  else if(state.view.name==='admin-catalogo') body = renderCatalogo(null, true);
  else if(state.view.name==='admin-usuarios') body = renderAdminUsuarios();
  else if(state.view.name==='admin-excluidos') body = renderAdminExcluidos();
  else if(state.view.name==='admin-processo-detalhe') body = renderProcessoDetalhe(state.view.id, true, false);
  else if(state.view.name==='cliente-processos') body = renderClienteProcessos(u);
  else if(state.view.name==='cliente-catalogo') body = renderCatalogo(company, false);
  else if(state.view.name==='cliente-processo-detalhe') body = renderProcessoDetalhe(state.view.id, false, false);
  else body = '<div class="empty-state">Tela não encontrada.</div>';

  return ''+
  '<div class="shell">'+
    '<aside class="sidebar">'+
      '<div class="brand"><img class="brand-logo" src="'+LOGO_DATA_URI+'" alt="Lucralize"><span class="brand-caption">Societário</span></div>'+
      '<nav class="nav-group">'+navHtml+'</nav>'+

          '<span class="demo-avatar">'+initials(u.nome)+'</span>'+
          '<span class="who"><strong>'+esc(u.nome)+'</strong><span>'+(admin?'Equipe Lucralize':esc(company?company.nome:''))+'</span></span>'+

/* ---------- CATÁLOGO (cliente ou admin, admin=readonly) ---------- */
function renderCatalogo(company, adminMode){
  var blocks = CATEGORY_ORDER.map(function(cat){
    var items = SERVICES.filter(function(s){return s.categoria===cat;});
    var cards = items.map(function(s){
      var price = company ? priceForCompany(s, company) : (s.precos.length===1 ? s.precos[0] : null);
      var priceHtml = price ? fmtMoney(price.valor) : 'Consulte valores';
      var priceLabel = price ? (price.tipo==='Valor único'||price.tipo==='A partir de'||price.tipo==='Valor único (todos os tipos)' ? (s.id==='alvara-funcionamento'?'a partir de · '+company_or_generic(company):'valor único') : 'para '+price.tipo) : '';

        '<span class="nome">'+esc(s.nome)+'</span>'+
        '<span class="resumo">'+esc(s.resumo)+'</span>'+

      '</label>'+

        '<button class="close-x" onclick="PS.closePanel()">✕</button>'+
      '</div>'+
      '<div class="panel-body">'+
        '<p style="color:var(--ink-soft); font-size:.87rem; line-height:1.5;">Envie abaixo os documentos e as informações necessárias para este serviço. Você pode anexar agora ou complementar depois — o que faltar fica sinalizado como pendente no acompanhamento do processo.</p>'+

        '<div><span class="eyebrow">Documentos necessários</span>'+
          '<div class="upload-list" style="margin-top:.7rem;">'+docRows+'</div>'+
        '</div>'+

        '<div class="field">'+
          '<label for="sol-info">Informações adicionais para o serviço</label>'+
          '<textarea id="sol-info" rows="5" placeholder="Descreva aqui os dados necessários para este serviço: ex. dados dos sócios, endereço, objeto social, capital social, motivo da alteração, etc."></textarea>'+
        '</div>'+

      '</div>'+

function onDocFileChosen(i){
  var input = document.getElementById('doc-'+i);
  var txt = document.getElementById('doc-'+i+'-txt');
  var row = input.closest('.upload-row');
  if(input.files && input.files[0]){
    txt.textContent = input.files[0].name;
    row.classList.add('attached');
  } else {
    txt.textContent = 'Anexar arquivo';
    row.classList.remove('attached');
  }
}
async function enviarSolicitacao(serviceId){
  var s = SERVICE_MAP[serviceId];
  var infoAdicional = (document.getElementById('sol-info')||{}).value || '';
  var submitBtn = document.getElementById('sol-submit-btn');
  if(submitBtn) submitBtn.disabled = true;

  var id = 'p'+Date.now();

  var documentosEnviados;
  try{
    documentosEnviados = await Promise.all(s.documentos.map(async function(nome, i){
      var input = document.getElementById('doc-'+i);
      var file = (input && input.files && input.files[0]) ? input.files[0] : null;
      if(!file) return {nome:nome, arquivo:null};
      var doc = await uploadArquivoReal(file, id, 'solicitacao');
      return {nome:nome, arquivo:doc.nome, path:doc.path};
    }));
  }catch(e){
    console.error('Erro ao enviar documentos da solicitação:', e);
    toast('Não foi possível enviar os documentos. Verifique sua internet e tente novamente.');
    if(submitBtn) submitBtn.disabled = false;
    return;
  }

  var anexados = documentosEnviados.filter(function(d){return d.arquivo;}).length;
  var total = documentosEnviados.length;

  var resumoTexto = 'Solicitação registrada pelo cliente no portal com '+anexados+' de '+total+' documento'+(total===1?'':'s')+' anexado'+(anexados===1?'':'s')+
    (infoAdicional.trim() ? ' e informações adicionais preenchidas.' : '.') + ' Aguardando envio do boleto.';

  var toastMsg = (anexados < total)
    ? ('Solicitação enviada! '+(total-anexados)+' documento(s) ainda pendente(s) — você pode enviá-los depois.')
    : 'Solicitação enviada com todos os documentos! Você receberá o boleto em breve.';

  var ok = await finalizarNovoProcesso({
    id:id, servicoId:serviceId, status:'aguardando_pagamento', etapaAtual:-1,
    criadoEm: todayISO(), protocolo:'',
    historico:[{data:todayISO(), hora:nowHM(), texto:resumoTexto, autor:'cliente'}],
    documentosAndamento:[], documentosFinais:[],
    solicitacaoInfo: infoAdicional,
    solicitacaoDocs: documentosEnviados
  }, toastMsg);
  if(!ok && submitBtn) submitBtn.disabled = false;
}

function fabArquivoNome(inputId){
  var el = document.getElementById(inputId);
  return (el && el.files && el.files[0]) ? el.files[0].name : null;
}
function fabFileChosen(inputId){
  var input = document.getElementById(inputId);
  var txt = document.getElementById(inputId+'-txt');
  if(!input) return;
  var row = input.closest('.upload-row');
  if(input.files && input.files[0]){
    if(txt) txt.textContent = input.files[0].name;
    if(row) row.classList.add('attached');
  } else {
    if(txt) txt.textContent = 'Anexar arquivo';
    if(row) row.classList.remove('attached');
  }
}
function fabNomeSocioChanged(idx){
  var nomeEl = document.getElementById('fab-s'+idx+'-nome');

  resto.style.display = nomeEl.value.trim() ? 'flex' : 'none';

function fabToggleEstadoCivil(idx){

function fabToggleIrModo(idx){

function fabNumSocios(){
  var radio = document.querySelector('input[name="fab-q2"]:checked');
  if(!radio || radio.value!=='sim') return 1;

  return qtd;
}
function fabColetarSocios(){
  var out = [];
  var i = 1;
  while(document.getElementById('fab-s'+i+'-nome')){
    out.push({
      nome: document.getElementById('fab-s'+i+'-nome').value.trim(),
      titulo: (document.getElementById('fab-s'+i+'-titulo')||{}).value || '',
      endereco: (document.getElementById('fab-s'+i+'-endereco')||{}).value || '',
      estadoCivil: (document.getElementById('fab-s'+i+'-civil')||{}).value || '',
      regime: (document.getElementById('fab-s'+i+'-regime')||{}).value || '',
      fotoArquivo: fabArquivoNome('fab-s'+i+'-foto'),
      irModo: (document.querySelector('input[name="fab-s'+i+'-ir-modo"]:checked')||{}).value || '',
      irArquivo2025: fabArquivoNome('fab-s'+i+'-ir-2025'),
      irArquivo2026: fabArquivoNome('fab-s'+i+'-ir-2026'),
      irNumero2025: (document.getElementById('fab-s'+i+'-ir-numero-2025')||{}).value || '',
      irNumero2026: (document.getElementById('fab-s'+i+'-ir-numero-2026')||{}).value || ''
    });
    i++;
  }
  return out;
}
async function fabArquivoReal(inputId, processoId, campoSlug){
  var el = document.getElementById(inputId);
  if(!el || !el.files || !el.files[0]) return null;
  return await uploadArquivoReal(el.files[0], processoId, 'formulario/'+campoSlug);
}
async function fabColetarSociosReal(processoId){
  var out = [];
  var i = 1;
  while(document.getElementById('fab-s'+i+'-nome')){
    out.push({
      nome: document.getElementById('fab-s'+i+'-nome').value.trim(),
      titulo: (document.getElementById('fab-s'+i+'-titulo')||{}).value || '',
      endereco: (document.getElementById('fab-s'+i+'-endereco')||{}).value || '',
      estadoCivil: (document.getElementById('fab-s'+i+'-civil')||{}).value || '',
      regime: (document.getElementById('fab-s'+i+'-regime')||{}).value || '',
      fotoArquivo: await fabArquivoReal('fab-s'+i+'-foto', processoId, 'socio'+i+'-foto'),
      irModo: (document.querySelector('input[name="fab-s'+i+'-ir-modo"]:checked')||{}).value || '',
      irArquivo2025: await fabArquivoReal('fab-s'+i+'-ir-2025', processoId, 'socio'+i+'-ir2025'),

function fabValidar(variant){
  var isTransf = variant === 'transformacao';
  var erros = [];
  function req(id, label){
    var el = document.getElementById(id);
    if(!el || !el.value || !el.value.trim()) erros.push(label);
  }
  function reqRadio(name, label){
    if(!document.querySelector('input[name="'+name+'"]:checked')) erros.push(label);
  }
  function reqFile(id, label){
    var el = document.getElementById(id);
    if(!el || !el.files || !el.files[0]) erros.push(label);
  }

  req('fab-q1-nome', 'Nome completo (pergunta 1)');

  if(isTransf){
    req('fab-transf-razaoatual', 'Razão Social (nome empresarial) - ATUAL');
    req('fab-transf-cnpj', 'Número do CNPJ');
  }

  reqRadio('fab-q2', 'Se a empresa terá outros sócios (pergunta 2)');
  var q2radio = document.querySelector('input[name="fab-q2"]:checked');
  if(q2radio && q2radio.value==='sim') req('fab-q2-qtd', 'Quantidade de sócios (pergunta 2)');

  reqRadio('fab-q3', 'Se irá utilizar o endereço fiscal Lucralize (pergunta 3)');
  var q3radio = document.querySelector('input[name="fab-q3"]:checked');
  if(q3radio && q3radio.value==='proprio'){
    req('fab-q3-endereco', 'Endereço (com CEP) da empresa em constituição (pergunta 3)');
    var iptuModo = document.querySelector('input[name="fab-q3-iptu-modo"]:checked');
    if(!iptuModo) erros.push('Guia de IPTU ou índice cadastral (pergunta 3)');
    else if(iptuModo.value==='upload') reqFile('fab-q3-iptu-file', 'Upload da guia de IPTU (pergunta 3)');
    else req('fab-q3-iptu-texto', 'Índice cadastral do IPTU (pergunta 3)');
    req('fab-q3-area', 'Área a ser utilizada pela empresa em m² (pergunta 3)');
  }

  req('fab-q4-razao1', '1ª opção de razão social (pergunta 4)');
  req('fab-q4-razao2', '2ª opção de razão social (pergunta 4)');
  req('fab-q6-capital', 'Valor do capital social (pergunta 6)');
  req('fab-q7-atividade', 'Atividade principal da empresa (pergunta 7)');
  req('fab-q8-secundarias', 'Atividades secundárias (pergunta 8)');

  var n = fabNumSocios();
  for(var i=1;i<=n;i++){
    req('fab-s'+i+'-nome', 'Nome completo do sócio '+i+' (pergunta 9)');
    req('fab-s'+i+'-titulo', 'Título de eleitor do sócio '+i+' (pergunta 9)');
    req('fab-s'+i+'-endereco', 'Endereço completo do sócio '+i+' (pergunta 9)');
    reqFile('fab-s'+i+'-foto', 'Documento de identificação com foto do sócio '+i+' (pergunta 9)');
    var irModo = document.querySelector('input[name="fab-s'+i+'-ir-modo"]:checked');
    if(irModo){
      if(irModo.value==='arquivo'){
        reqFile('fab-s'+i+'-ir-2025', 'Upload do recibo de IR 2025 do sócio '+i+' (pergunta 9)');
        reqFile('fab-s'+i+'-ir-2026', 'Upload do recibo de IR 2026 do sócio '+i+' (pergunta 9)');
      } else {
        req('fab-s'+i+'-ir-numero-2025', 'Número da declaração de IR 2025 do sócio '+i+' (pergunta 9)');
        req('fab-s'+i+'-ir-numero-2026', 'Número da declaração de IR 2026 do sócio '+i+' (pergunta 9)');
      }
    }
    var civilSel = document.getElementById('fab-s'+i+'-civil');
    if(!civilSel || !civilSel.value) erros.push('Estado civil do sócio '+i+' (pergunta 9)');
    else if(civilSel.value!=='Solteiro(a)'){
      var regimeSel = document.getElementById('fab-s'+i+'-regime');
      if(!regimeSel || !regimeSel.value) erros.push('Regime de casamento do sócio '+i+' (pergunta 9)');
    }
  }

  reqRadio('fab-q10', 'Natureza jurídica (pergunta 10)');
  reqRadio('fab-q11', 'Enquadramento da empresa (pergunta 11)');
  reqRadio('fab-q12', 'Opção pelo Simples Nacional (pergunta 12)');

  reqRadio('fab-q13', 'Telefone para o cartão CNPJ (pergunta 13)');
  var q13radio = document.querySelector('input[name="fab-q13"]:checked');
  if(q13radio && q13radio.value==='pessoal') req('fab-q13-tel', 'Número de telefone pessoal (pergunta 13)');

  reqRadio('fab-q14', 'E-mail para o cartão CNPJ (pergunta 14)');
  var q14radio = document.querySelector('input[name="fab-q14"]:checked');
  if(q14radio && q14radio.value==='pessoal') req('fab-q14-email', 'E-mail pessoal (pergunta 14)');

  var ciente = document.getElementById('fab-q15-ciente');
  if(!ciente || !ciente.checked) erros.push('Confirmação "Estou ciente!" do serviço prestado (pergunta 15)');

  var cienteUrgencia = document.getElementById('fab-urgencia-ciente');
  if(!cienteUrgencia || !cienteUrgencia.checked) erros.push('Confirmação "Estou ciente!" sobre taxa de urgência e cancelamento');

  return erros;
}

async function enviarSolicitacaoAbertura(variant){
  variant = variant || 'abertura';
  var isTransf = variant === 'transformacao';
  var erros = fabValidar(variant);
  var errBox = document.getElementById('fab-errors');
  if(erros.length){
    if(errBox){
      errBox.style.display = 'block';
      errBox.innerHTML = '<strong>Antes de enviar, complete os campos obrigatórios abaixo:</strong><ul style="margin:.5rem 0 0 1.1rem; padding:0;">'+erros.map(function(e){return '<li>'+esc(e)+'</li>';}).join('')+'</ul>';
      errBox.scrollIntoView({behavior:'smooth', block:'start'});
    }
    toast('Existem campos obrigatórios pendentes.');
    return;
  }

  var submitBtn = document.getElementById('fab-submit-btn');
  if(submitBtn) submitBtn.disabled = true;
  toast('Enviando arquivos...');

  var u = currentUser();
  var q2radio = document.querySelector('input[name="fab-q2"]:checked');
  var q3radio = document.querySelector('input[name="fab-q3"]:checked');
  var iptuModo = document.querySelector('input[name="fab-q3-iptu-modo"]:checked');
  var q10radio = document.querySelector('input[name="fab-q10"]:checked');
  var q11radio = document.querySelector('input[name="fab-q11"]:checked');
  var q12radio = document.querySelector('input[name="fab-q12"]:checked');
  var q13radio = document.querySelector('input[name="fab-q13"]:checked');
  var q14radio = document.querySelector('input[name="fab-q14"]:checked');
  var isProprio = q3radio.value==='proprio';
  var servicoId = isTransf ? 'transformacao-mei-me' : 'abertura-cnpj';
  var id = 'p'+Date.now();

  var dados;
  try{
    dados = {
      nomeCompleto: document.getElementById('fab-q1-nome').value.trim(),
      outrosSocios: q2radio.value==='sim',
      qtdSocios: fabNumSocios(),
      enderecoFiscalLucralize: q3radio.value==='lucralize',
      enderecoProprio: isProprio ? document.getElementById('fab-q3-endereco').value.trim() : '',
      iptuModo: isProprio && iptuModo ? iptuModo.value : '',
      iptuIndice: (isProprio && iptuModo && iptuModo.value==='texto') ? document.getElementById('fab-q3-iptu-texto').value.trim() : '',
      iptuArquivo: (isProprio && iptuModo && iptuModo.value==='upload') ? await fabArquivoReal('fab-q3-iptu-file', id, 'iptu') : null,
      areaM2: isProprio ? document.getElementById('fab-q3-area').value.trim() : '',
      razaoSocial1: document.getElementById('fab-q4-razao1').value.trim(),
      razaoSocial2: document.getElementById('fab-q4-razao2').value.trim(),
      nomeFantasia: document.getElementById('fab-q5-fantasia').value.trim(),
      capitalSocial: document.getElementById('fab-q6-capital').value.trim(),
      atividadePrincipal: document.getElementById('fab-q7-atividade').value.trim(),
      atividadesSecundarias: document.getElementById('fab-q8-secundarias').value.trim(),
      socios: await fabColetarSociosReal(id),
      naturezaJuridica: q10radio.value,
      enquadramento: q11radio.value,
      simplesNacional: q12radio.value,
      telefoneOpcao: q13radio.value,
      telefonePessoal: q13radio.value==='pessoal' ? document.getElementById('fab-q13-tel').value.trim() : '',
      emailOpcao: q14radio.value,
      emailPessoal: q14radio.value==='pessoal' ? document.getElementById('fab-q14-email').value.trim() : '',
      cienteServico: true
    };
  }catch(e){
    console.error(e);
    if(submitBtn) submitBtn.disabled = false;
    toast('Não foi possível enviar um ou mais arquivos. Tente novamente.');
    return;
  }
  if(isTransf){
    dados.razaoSocialAtual = document.getElementById('fab-transf-razaoatual').value.trim();
    dados.cnpjAtual = document.getElementById('fab-transf-cnpj').value.trim();
  }

  var ok = await finalizarNovoProcesso({
    id:id, servicoId:servicoId, status:'aguardando_pagamento', etapaAtual:-1,
    criadoEm: todayISO(), protocolo:'',
    historico:[{data:todayISO(), hora:nowHM(), texto:(isTransf?'Formulário de transformação de MEI para ME':'Formulário de abertura de CNPJ')+' preenchido e enviado pelo cliente. Aguardando envio do boleto.', autor:'cliente'}],
    documentosAndamento:[], documentosFinais:[],
    formularioAbertura: dados
  });
  if(!ok && submitBtn) submitBtn.disabled = false;
}

function altValidar(servicoId){
  var erros = [];
  var isComplexa = servicoId === 'alteracao-complexa';
  function req(id, label){
    var el = document.getElementById(id);
    if(!el || !el.value || !el.value.trim()) erros.push(label);
  }
  function reqFile(id, label){
    var el = document.getElementById(id);
    if(!el || !el.files || !el.files[0]) erros.push(label);
  }

  req('alt-q1-nome', 'Nome completo (pergunta 1)');

  if(isComplexa){
    req('alt-origem-estado', 'UF de origem');
    req('alt-destino-estado', 'UF de destino');
    req('alt-destino-municipio', 'Município de destino');
  }

  var endereco = !!(document.getElementById('alt-tipo-endereco')||{}).checked;
  var quadro = !!(document.getElementById('alt-tipo-quadro')||{}).checked;
  var atividades = !!(document.getElementById('alt-tipo-atividades')||{}).checked;
  var capital = !!(document.getElementById('alt-tipo-capital')||{}).checked;
  var nome = !!(document.getElementById('alt-tipo-nome')||{}).checked;

  if(!(endereco||quadro||atividades||capital||nome)){
    erros.push('Selecione ao menos um tipo de Alteração Contratual');
  }

  if(endereco){
    req('alt-endereco-novo', 'Novo endereço completo (Endereço)');
  }
  if(atividades){
    req('alt-ativ-nova-cnae', 'CNAE da nova atividade (Atividades Econômicas)');
    req('alt-ativ-nova-desc', 'Descrição da nova atividade (Atividades Econômicas)');
    req('alt-ativ-principal', 'Atividade principal resultante (Atividades Econômicas)');
  }
  if(endereco || atividades){
    if(!document.querySelector('input[name="alt-local"]:checked')) erros.push('Confirmação se a atividade é presencial ou apenas fiscal');
    req('alt-iptu-area', 'Área a ser utilizada pela empresa em m²');
  }
  if(endereco || atividades || nome){
    var iptuModo = document.querySelector('input[name="alt-iptu-modo"]:checked');
    if(!iptuModo) erros.push('Guia de IPTU ou índice cadastral');
    else if(iptuModo.value==='upload') reqFile('alt-iptu-file', 'Upload da guia de IPTU');
    else req('alt-iptu-texto', 'Índice cadastral do IPTU');
  }
  if(quadro){
    req('alt-quadro-capital', 'Divisão do quadro societário após a alteração');
  }
  if(capital){
    req('alt-capital-novo-valor', 'Novo valor do capital social');
    req('alt-capital-percentual', 'Divisão percentual do novo capital social');
  }
  if(quadro || capital){
    var n = altNumSocios();
    for(var i=1;i<=n;i++){
      req('fab-s'+i+'-nome', 'Nome completo do sócio '+i);
      req('fab-s'+i+'-titulo', 'Título de eleitor do sócio '+i);
      req('fab-s'+i+'-endereco', 'Endereço completo do sócio '+i);
      reqFile('fab-s'+i+'-foto', 'Documento de identificação com foto do sócio '+i);
      var irModo = document.querySelector('input[name="fab-s'+i+'-ir-modo"]:checked');
      if(irModo){
        if(irModo.value==='arquivo'){
          reqFile('fab-s'+i+'-ir-2025', 'Upload do recibo de IR 2025 do sócio '+i);
          reqFile('fab-s'+i+'-ir-2026', 'Upload do recibo de IR 2026 do sócio '+i);
        } else {
          req('fab-s'+i+'-ir-numero-2025', 'Número da declaração de IR 2025 do sócio '+i);
          req('fab-s'+i+'-ir-numero-2026', 'Número da declaração de IR 2026 do sócio '+i);
        }
      }
      var civilSel = document.getElementById('fab-s'+i+'-civil');
      if(!civilSel || !civilSel.value) erros.push('Estado civil do sócio '+i);
      else if(civilSel.value!=='Solteiro(a)'){
        var regimeSel = document.getElementById('fab-s'+i+'-regime');
        if(!regimeSel || !regimeSel.value) erros.push('Regime de casamento do sócio '+i);
      }
    }
  }
  if(nome){
    req('alt-nome-razao', 'Razão social desejada (Nome Empresarial)');
    var fantasiaChk = document.getElementById('alt-nome-fantasia-chk');
    if(fantasiaChk && fantasiaChk.checked) req('alt-nome-fantasia-novo', 'Novo nome fantasia (Nome Empresarial)');
  }

  var ciente = document.getElementById('alt-q-ciente');
  if(!ciente || !ciente.checked) erros.push('Confirmação "Estou ciente!" do serviço prestado');

  var cienteUrgencia = document.getElementById('alt-urgencia-ciente');
  if(!cienteUrgencia || !cienteUrgencia.checked) erros.push('Confirmação "Estou ciente!" sobre taxa de urgência e cancelamento');

  return erros;
}

async function enviarSolicitacaoAlteracao(servicoId){
  var erros = altValidar(servicoId);
  var errBox = document.getElementById('alt-errors');
  if(erros.length){
    if(errBox){
      errBox.style.display = 'block';
      errBox.innerHTML = '<strong>Antes de enviar, complete os campos obrigatórios abaixo:</strong><ul style="margin:.5rem 0 0 1.1rem; padding:0;">'+erros.map(function(e){return '<li>'+esc(e)+'</li>';}).join('')+'</ul>';
      errBox.scrollIntoView({behavior:'smooth', block:'start'});
    }
    toast('Existem campos obrigatórios pendentes.');
    return;
  }

  var submitBtn = document.getElementById('alt-submit-btn');
  if(submitBtn) submitBtn.disabled = true;
  toast('Enviando arquivos...');

  var u = currentUser();
  var s = SERVICE_MAP[servicoId];
  var isComplexa = servicoId === 'alteracao-complexa';
  var endereco = !!(document.getElementById('alt-tipo-endereco')||{}).checked;
  var quadro = !!(document.getElementById('alt-tipo-quadro')||{}).checked;
  var atividades = !!(document.getElementById('alt-tipo-atividades')||{}).checked;
  var capital = !!(document.getElementById('alt-tipo-capital')||{}).checked;
  var nome = !!(document.getElementById('alt-tipo-nome')||{}).checked;
  var localRadio = document.querySelector('input[name="alt-local"]:checked');
  var iptuModo = document.querySelector('input[name="alt-iptu-modo"]:checked');
  var fantasiaChk = document.getElementById('alt-nome-fantasia-chk');
  var id = 'p'+Date.now();

  var tiposLabels = [];
  if(endereco) tiposLabels.push('Endereço');
  if(quadro) tiposLabels.push('Quadro Societário');
  if(atividades) tiposLabels.push('Atividades Econômicas');
  if(capital) tiposLabels.push('Capital Social');
  if(nome) tiposLabels.push('Nome Empresarial');

  var dados;
  try{
  dados = {
    nomeCompleto: document.getElementById('alt-q1-nome').value.trim(),
    origemEstado: isComplexa ? document.getElementById('alt-origem-estado').value.trim() : '',
    destinoEstado: isComplexa ? document.getElementById('alt-destino-estado').value.trim() : '',
    destinoMunicipio: isComplexa ? document.getElementById('alt-destino-municipio').value.trim() : '',
    tipos: tiposLabels,
    endereco: endereco ? { novoEndereco: document.getElementById('alt-endereco-novo').value.trim() } : null,
    atividades: atividades ? {
      novaCnae: document.getElementById('alt-ativ-nova-cnae').value.trim(),
      novaDesc: document.getElementById('alt-ativ-nova-desc').value.trim(),
      principalResultante: document.getElementById('alt-ativ-principal').value.trim(),
      secundariasResultantes: document.getElementById('alt-ativ-secundarias').value.trim()
    } : null,
    localConfirmacao: (endereco||atividades) && localRadio ? localRadio.value : '',
    iptuModo: (endereco||atividades||nome) && iptuModo ? iptuModo.value : '',
    iptuIndice: (endereco||atividades||nome) && iptuModo && iptuModo.value==='texto' ? document.getElementById('alt-iptu-texto').value.trim() : '',
    iptuArquivo: (endereco||atividades||nome) && iptuModo && iptuModo.value==='upload' ? await fabArquivoReal('alt-iptu-file', id, 'iptu') : null,
    iptuArea: (endereco||atividades) ? document.getElementById('alt-iptu-area').value.trim() : '',
    quadroDivisao: quadro ? document.getElementById('alt-quadro-capital').value.trim() : '',
    capitalNovoValor: capital ? document.getElementById('alt-capital-novo-valor').value.trim() : '',
    capitalPercentual: capital ? document.getElementById('alt-capital-percentual').value.trim() : '',
    socios: (quadro||capital) ? await fabColetarSociosReal(id) : [],
    razaoSocialDesejada: nome ? document.getElementById('alt-nome-razao').value.trim() : '',
    alterarNomeFantasia: (nome && fantasiaChk) ? fantasiaChk.checked : false,
    nomeFantasiaNovo: (nome && fantasiaChk && fantasiaChk.checked) ? document.getElementById('alt-nome-fantasia-novo').value.trim() : '',
    cienteServico: true
  };
  }catch(e){
    console.error(e);
    if(submitBtn) submitBtn.disabled = false;
    toast('Não foi possível enviar um ou mais arquivos. Tente novamente.');
    return;
  }

  var ok = await finalizarNovoProcesso({
    id:id, servicoId:servicoId, status:'aguardando_pagamento', etapaAtual:-1,
    criadoEm: todayISO(), protocolo:'',
    historico:[{data:todayISO(), hora:nowHM(), texto:'Formulário de '+s.nome+' preenchido e enviado pelo cliente. Aguardando envio do boleto.', autor:'cliente'}],
    documentosAndamento:[], documentosFinais:[],
    formularioAlteracao: dados
  });
  if(!ok && submitBtn) submitBtn.disabled = false;
}

function renderFormularioAlteracaoResumo(p){

    if(!doc) return '';

    var path = doc && typeof doc === 'object' ? doc.path : null;
    var btn = path
      ? '<button class="btn btn-subtle btn-sm" style="flex:none;" onclick="PS.baixarArquivoReal(\''+esc(path)+'\')">Baixar</button>'
      : '<button class="btn btn-subtle btn-sm" style="flex:none;" disabled title="Arquivo original não disponível para download">Baixar</button>';

        '<span class="name" style="white-space:normal; overflow:visible; text-overflow:clip; line-height:1.35;">'+esc(label)+'<span style="display:block; font-size:.74rem; font-weight:500; color:var(--ink-faint); margin-top:.15rem;">'+esc(nomeArquivo)+'</span></span>'+

        (sc.irNumero2026 ? '<div class="info-block"><span class="lbl">Recibo de IR 2026 — número</span><span class="val">'+esc(sc.irNumero2026)+'</span></div>' : '')+
      '</div>'+
    '</div>';
  }).join('');

  var docItems = [];

  var docsHtml = docItems.length ? docItems.join('') : '<p style="font-size:.84rem; color:var(--ink-faint);">Nenhum documento anexado pelo cliente neste formulário.</p>';

  return '<div class="card" style="padding:1.2rem 1.3rem; display:flex; flex-direction:column; gap:1.3rem;">'+

    '</div>'+

function baxValidar(){
  var erros = [];
  function req(id, label){
    var el = document.getElementById(id);
    if(!el || !el.value || !el.value.trim()) erros.push(label);
  }
  function reqFile(id, label){
    var el = document.getElementById(id);
    if(!el || !el.files || !el.files[0]) erros.push(label);
  }

  var q1radio = document.querySelector('input[name="bax-q1-pendencias"]:checked');
  if(!q1radio){ erros.push('Se o CNPJ possui pendências em aberto (pergunta 1)'); return erros; }

  if(q1radio.value==='nao'){
    reqFile('bax-cert-federal', 'Certidão Negativa Federal');
    var estadualNA = document.getElementById('bax-cert-estadual-na');
    if(!(estadualNA && estadualNA.checked)) reqFile('bax-cert-estadual', 'Certidão Negativa Estadual');
    reqFile('bax-cert-municipal', 'Certidão Negativa Municipal');
    reqFile('bax-relatorio-fiscal', 'Relatório de situação fiscal');
  } else {
    var algumParcelamento = false;
    ['federal','municipal','estadual'].forEach(function(esfera){
      var radio = document.querySelector('input[name="bax-parc-'+esfera+'-tem"]:checked');
      if(radio && radio.value==='sim'){
        algumParcelamento = true;
        req('bax-parc-'+esfera+'-qtd', 'Quantidade de parcelamentos ativos ('+esfera+')');
        req('bax-parc-'+esfera+'-situacao', 'Situação do pagamento do parcelamento ('+esfera+')');
      }
    });
    if(algumParcelamento){
      var parcCiente = document.getElementById('bax-parc-ciente');
      if(!parcCiente || !parcCiente.checked) erros.push('Confirmação "Estou ciente!" sobre a continuidade dos pagamentos das parcelas');
    }
    var regularizarRadio = document.querySelector('input[name="bax-regularizar"]:checked');
    if(!regularizarRadio) erros.push('Se as pendências serão regularizadas antes da baixa ou não');
    else if(regularizarRadio.value==='sem_regularizar'){
      var regularizarCiente = document.getElementById('bax-regularizar-ciente');
      if(!regularizarCiente || !regularizarCiente.checked) erros.push('Confirmação "Estou ciente!" sobre débitos direcionados ao CPF do responsável');
    }
  }

  var finalCiente = document.getElementById('bax-final-ciente');
  if(!finalCiente || !finalCiente.checked) erros.push('Confirmação "Estou ciente!" das obrigações do último mês e do honorário da última competência');

  return erros;
}

async function enviarSolicitacaoBaixa(){
  var erros = baxValidar();
  var errBox = document.getElementById('bax-errors');
  if(erros.length){
    if(errBox){
      errBox.style.display = 'block';
      errBox.innerHTML = '<strong>Antes de enviar, complete os campos obrigatórios abaixo:</strong><ul style="margin:.5rem 0 0 1.1rem; padding:0;">'+erros.map(function(e){return '<li>'+esc(e)+'</li>';}).join('')+'</ul>';
      errBox.scrollIntoView({behavior:'smooth', block:'start'});
    }
    toast('Existem campos obrigatórios pendentes.');
    return;
  }

  var submitBtn = document.getElementById('bax-submit-btn');
  if(submitBtn) submitBtn.disabled = true;
  toast('Enviando arquivos...');

  var u = currentUser();
  var s = SERVICE_MAP['baixa-cnpj'];
  var q1radio = document.querySelector('input[name="bax-q1-pendencias"]:checked');
  var temPendencias = q1radio.value==='sim';
  var estadualNA = document.getElementById('bax-cert-estadual-na');
  var id = 'p'+Date.now();

  var parcelamentos = {};
  ['federal','municipal','estadual'].forEach(function(esfera){
    var radio = document.querySelector('input[name="bax-parc-'+esfera+'-tem"]:checked');
    if(radio && radio.value==='sim'){
      parcelamentos[esfera] = {
        qtd: document.getElementById('bax-parc-'+esfera+'-qtd').value.trim(),
        situacao: document.getElementById('bax-parc-'+esfera+'-situacao').value
      };
    }
  });
  var regularizarRadio = document.querySelector('input[name="bax-regularizar"]:checked');

  var dados;
  try{
    dados = {
      temPendencias: temPendencias,
      certidaoFederalArquivo: !temPendencias ? await fabArquivoReal('bax-cert-federal', id, 'certidao-federal') : null,
      estadualNaoAplica: !temPendencias ? !!(estadualNA && estadualNA.checked) : false,
      certidaoEstadualArquivo: (!temPendencias && !(estadualNA && estadualNA.checked)) ? await fabArquivoReal('bax-cert-estadual', id, 'certidao-estadual') : null,
      certidaoMunicipalArquivo: !temPendencias ? await fabArquivoReal('bax-cert-municipal', id, 'certidao-municipal') : null,
      relatorioFiscalArquivo: !temPendencias ? await fabArquivoReal('bax-relatorio-fiscal', id, 'relatorio-fiscal') : null,
      parcelamentos: parcelamentos,
      regularizacaoOpcao: temPendencias && regularizarRadio ? regularizarRadio.value : '',
      cienteServico: true
    };
  }catch(e){
    console.error(e);
    if(submitBtn) submitBtn.disabled = false;
    toast('Não foi possível enviar um ou mais arquivos. Tente novamente.');
    return;
  }

  var ok = await finalizarNovoProcesso({
    id:id, servicoId:'baixa-cnpj', status:'aguardando_pagamento', etapaAtual:-1,
    criadoEm: todayISO(), protocolo:'',
    historico:[{data:todayISO(), hora:nowHM(), texto:'Formulário de '+s.nome+' preenchido e enviado pelo cliente. Aguardando envio do boleto.', autor:'cliente'}],
    documentosAndamento:[], documentosFinais:[],
    formularioBaixa: dados
  });
  if(!ok && submitBtn) submitBtn.disabled = false;
}

function renderFormularioBaixaResumo(p){
  var d = p.formularioBaixa;
  if(!d) return '';

  function docRow(label, doc){
    if(!doc) return '';
    var nomeArquivo = typeof doc === 'string' ? doc : doc.nome;
    var path = doc && typeof doc === 'object' ? doc.path : null;
    var btn = path
      ? '<button class="btn btn-subtle btn-sm" style="flex:none;" onclick="PS.baixarArquivoReal(\''+esc(path)+'\')">Baixar</button>'
      : '<button class="btn btn-subtle btn-sm" style="flex:none;" disabled title="Arquivo original não disponível para download">Baixar</button>';
    return '<div class="file-row" style="align-items:flex-start;">'+
        '<span class="ic" style="margin-top:.1rem;">📄</span>'+
        '<span class="name" style="white-space:normal; overflow:visible; text-overflow:clip; line-height:1.35;">'+esc(label)+'<span style="display:block; font-size:.74rem; font-weight:500; color:var(--ink-faint); margin-top:.15rem;">'+esc(nomeArquivo)+'</span></span>'+
        btn+
      '</div>';
  }

  var docItems = [];
  if(d.certidaoFederalArquivo) docItems.push(docRow('Certidão Negativa Federal', d.certidaoFederalArquivo));
  if(d.certidaoEstadualArquivo) docItems.push(docRow('Certidão Negativa Estadual', d.certidaoEstadualArquivo));
  if(d.certidaoMunicipalArquivo) docItems.push(docRow('Certidão Negativa Municipal', d.certidaoMunicipalArquivo));
  if(d.relatorioFiscalArquivo) docItems.push(docRow('Relatório de situação fiscal', d.relatorioFiscalArquivo));
  var docsHtml = docItems.length ? docItems.join('') : '<p style="font-size:.84rem; color:var(--ink-faint);">Nenhum documento anexado pelo cliente neste formulário.</p>';

  var parcelamentosHtml = Object.keys(d.parcelamentos||{}).map(function(esfera){
    var pdata = d.parcelamentos[esfera];
    var esferaLabel = {federal:'Federal', municipal:'Municipal', estadual:'Estadual'}[esfera] || esfera;
    var situacaoLabel = {em_dia:'Em dia', atrasado:'Atrasado'}[pdata.situacao] || pdata.situacao;
    return '<div class="info-block"><span class="lbl">Parcelamento '+esferaLabel+'</span><span class="val">'+esc(pdata.qtd)+' parcelamento(s) — '+esc(situacaoLabel)+'</span></div>';
  }).join('');

  var regularizacaoLabel = {antes:'Cliente irá regularizar antes da baixa', sem_regularizar:'Cliente optou por prosseguir sem regularizar'}[d.regularizacaoOpcao] || '—';

  return '<div class="card" style="padding:1.2rem 1.3rem; display:flex; flex-direction:column; gap:1.3rem;">'+
    '<div style="display:flex; align-items:center; justify-content:space-between; gap:.8rem; flex-wrap:wrap;">'+
      '<span class="eyebrow">Formulário de Baixa de CNPJ enviado pelo cliente</span>'+
      '<span class="pill tag-confirmado"><span class="pill-dot"></span>Respostas e documentos do cliente</span>'+
    '</div>'+
    '<div>'+
      '<div class="eyebrow" style="margin-bottom:.7rem;">Dados gerais</div>'+
      '<div class="info-grid">'+
        '<div class="info-block"><span class="lbl">Possui pendências em aberto</span><span class="val">'+(d.temPendencias?'Sim':'Não')+'</span></div>'+
        (d.estadualNaoAplica ? '<div class="info-block"><span class="lbl">Inscrição estadual</span><span class="val">Não possui (N/A)</span></div>' : '')+
        (d.temPendencias ? '<div class="info-block"><span class="lbl">Regularização</span><span class="val">'+esc(regularizacaoLabel)+'</span></div>' : '')+
        parcelamentosHtml+
      '</div>'+
    '</div>'+
    '<div>'+
      '<div class="eyebrow" style="margin-bottom:.7rem;">Documentos anexados pelo cliente</div>'+
      '<div class="upload-list">'+docsHtml+'</div>'+
    '</div>'+
  '</div>';
}
